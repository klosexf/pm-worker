<!--
  PM Copilot 交互原型 v4 —— TraeWork Light 设计系统版（基于 v3 交互逻辑重制）
  v4.1 更新（同步 design.md v0.9 / PRD v1.2 · FR6 三层闭环）：
  · 对话流新增「漏项雷达四档声明卡」（✅已覆盖 / ❓可能遗漏 / ⏭️刻意不展开 / 💀致命漏洞假设）
  · 💀 登记行：触发条件 + 活跃 1/3 软上限 + 跳转风险登记册（risks.jsonl）
  · 文件树新增 risks.jsonl · 决策日志 5 条（含 d_006 💀命中回写）
  · 按阶段视图：阶段收尾新增「💀 登记 N」Tag
  · 交接视图：封板时展示💀终态结算（未触发关闭 / 命中回写，悬空口径闭合 · A16a）
  v4.2 更新（决策日志入口 · FR7/A14）：
  · 按阶段视图新增「决策日志 · 五要素详情」入口（本会话/累计计数）
  · 各阶段「决策 +N」Tag 可点击 → 弹窗按阶段筛选
  · 决策日志弹窗：筛选（本会话/全部/阶段）+ 单条卡片逐行展开五要素（决策/WHY/排除方案+机会成本/置信度/待验证）
  · 含💀命中回写条目（预测 vs 实际）、覆盖旧结论回链、追问会话/v1.0 封存来源标签
  v4.3 更新（上下文面板瘦身）：
  · 右栏「上下文」只保留注入的知识卡（query + 命中卡 + scope 过滤说明）
  · 移除 Token 构成 / Skill 注入 / 记忆注入 / 落盘校验四段（技能调用在对话思考过程展示 · 记忆写入见对话系统行与记忆页）
  · 对话流 Context Builder 系统行同步精简为「知识卡 N · PRD 模板」
  v4.4 更新（决策日志独立页面 · FR7/A13/A14/E14）：
  · 左栏「决策日志」入口可点击 → 独立页面（v4.2 仅阶段视图弹窗，现首页左上角可直接进入）
  · 页面：项目筛选 + 状态筛选（待验证未闭环/已闭环/💀命中回写/覆盖回链）+ 搜索
  · 卡片视图复用五要素决策卡 · 待验证未闭环高亮并可「验证闭环 · 追加记录」（append-only 不改写原条目）
  · JSONL 原文视图：按 design.md §5.2 schema 逐行展示 decisions.jsonl（每行一条 · 尾部追加 · 永不删除）
  设计系统：TraeWork Design Library（Light mode only）
  · Token 全量内联自 colors_and_type.css（--bg-* / --text-* / --status-* / --radius-* / --spacer-*）
  · 组件对齐 .ds-btn / .ds-tag / .ds-card / .ds-input / .ds-switch / .ds-dialog 规范
  · 图标全部来自 TraeWork assets/icons（currentColor 单色图标，16/14px 体系，禁用 emoji）
  · 表面分层：主画布 --bg-base-default 白 · 侧栏/面板/卡片 --bg-base-secondary · 交互走 overlay 阶梯
  · 品牌色 #4B3FE3 稀缺使用：品牌时刻 / 唯一主 CTA / 运行态小状态点 / 链接
-->

/* ════════ 基础样式 ════════ */
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  font-family: var(--font-family-default);
  background: var(--bg-base-tertiary);
  color: var(--text-default);
  display:flex; align-items:center; justify-content:center;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
#stage { transform-origin:center center; }
::selection { background: var(--bg-brand-popup); }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background: rgba(115,115,115,0.28); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(115,115,115,0.45); }
::-webkit-scrollbar-track { background: transparent; }
textarea { resize:none; font-family:inherit; }
button { font-family:inherit; }
input,select { font-family:inherit; }
:focus { outline:none; }
:focus-visible { outline:2px solid var(--border-neutral-l3); outline-offset:2px; }

/* 图标容器：TraeWork currentColor SVG，尺寸由容器决定 */
.ic { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
.ic svg { width:100%; height:100%; display:block; }

/* 动效：≤300ms · 位移 ≤4px · 尊重 reduced-motion */
.fadein { animation:fadein .2s ease both; }
@keyframes fadein { from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }
.slidein { animation:slidein .2s ease both; }
@keyframes slidein { from{opacity:0; transform:translateX(4px);} to{opacity:1; transform:none;} }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
.run-dot { animation:pulse 1.5s infinite; }
@media (prefers-reduced-motion: reduce) {
  .fadein,.slidein,.run-dot { animation:none !important; }
}

/* 会话查找：按 sid 遍历全部树（含「默认」项目与运行时新建会话） */
const ALL_TREES = [DEFAULT_PROJECT, ...TASK_TREE];
const EXTRA_SESSIONS = [];   // 运行时「新建会话」落点：{pKey, ver, session}
let _sidSeq = 0;
function findSession(sid){
  const ex = EXTRA_SESSIONS.find(e=>e.session.id===sid);
  if (ex) return ex.session;
  for (const p of ALL_TREES) for (const vn of (p.versions||[])) for (const s of (vn.sessions||[]))
    if (s.id===sid) return s;
  return null;
}
/* 某项目/版本下的会话列表 = 预置 + 运行时新建（原型演示） */
const sessionsOf = (pKey, ver) =>
  ((ALL_TREES.find(p=>p.key===pKey)?.versions.find(v=>v.v===ver)?.sessions)||[])
    .concat(EXTRA_SESSIONS.filter(e=>e.pKey===pKey && e.ver===ver).map(e=>e.session));

/* ================= 基础组件（对齐 .ds-tag / .ds-btn / .ds-switch 规范） ================= */

/* 标签：ds-tag — h22 · radius-8 · body-sm-strong · 语义 surface（使用 .ds-tag 类） */
function Tag({children, c, bg, mono, v}) {
  const cls = ['ds-tag'];
  if (v === 'brand')   cls.push('ds-tag--brand');
  else if (v === 'success') cls.push('ds-tag--success');
  else if (v === 'warning') cls.push('ds-tag--warning');
  else if (v === 'danger')  cls.push('ds-tag--danger');
  const extra = (c || bg || mono) ? {
    color: c || undefined,
    background: bg || undefined,
    fontFamily: mono ? F.mono : undefined,
  } : undefined;
  return <span className={cls.join(' ')} style={extra}>{children}</span>;
}

/* 按钮：ds-btn — 24/28 高 · radius-8 · body-base-strong · 120ms 过渡 · overlay 阶梯交互（使用 .ds-btn 类） */
function Btn({children, onClick, kind='secondary', disabled, small, icon, title}) {
  const cls = ['ds-btn'];
  if (small) cls.push('ds-btn--sm');
  if (kind === 'primary')      cls.push('ds-btn--primary');
  else if (kind === 'brand')   cls.push('ds-btn--brand');
  else if (kind === 'secondary') cls.push('ds-btn--secondary');
  else if (kind === 'ghost')   cls.push('ds-btn--ghost');
  else if (kind === 'danger')  cls.push('ds-btn--danger');
  else if (kind === 'dangerSubtle') cls.push('ds-btn--danger-subtle');
  return <button className={cls.join(' ')} title={title} disabled={disabled}
    onClick={disabled?undefined:onClick}>
    {icon && I(icon, small?11:12, {color:'currentColor'})}{children}
  </button>;
}

/* 阶段头像：序数字形 + 阶段语义 surface（type-first，不用插图） */
function Avatar({stage, size=24}) {
  const m = STAGES[stage];
  return (
    <div style={{width:size, height:size, borderRadius:'50%', background:m.sf, color:m.c,
      display:'flex', alignItems:'center', justifyContent:'center',
      fontSize:Math.max(9, Math.round(size*0.46)), fontWeight:600, flexShrink:0, lineHeight:1}}>{m.n}</div>
  );
}

/* 会话/流水线状态点：done=success 实心 · run=品牌实心（Agent 运行态小状态点）· todo=中性描边 */
function Dot({st, size=6}) {
  if (st==='run') return <span className="run-dot" style={{width:size, height:size, borderRadius:'50%', background:'var(--bg-brand)', display:'inline-block', flexShrink:0}}/>;
  if (st==='done') return <span style={{width:size, height:size, borderRadius:'50%', background:'var(--status-success-default)', display:'inline-block', flexShrink:0}}/>;
  return <span style={{width:size, height:size, borderRadius:'50%', border:'1.5px solid var(--border-neutral-l3)', display:'inline-block', flexShrink:0}}/>;
}

/* 树形展开箭头（TraeWork Collapse-triangle） */
function Chev({open, size=8}) {
  return I('Collapse-triangle', size, {color:'var(--icon-tertiary)', flexShrink:0,
    transform: open ? 'rotate(90deg)' : 'none', transition:'transform .15s ease'});
}

/* 分段切换器：中性 overlay 激活态（不用品牌填充） */
function Seg({options, value, onChange}) {
  return (
    <div style={{display:'flex', background:'var(--bg-overlay-l1)', borderRadius:8, padding:2, gap:2}} role="tablist">
      {options.map(o=>{
        const [v, label] = o; const extra = o[2];
        const on = v===value;
        return (
          <div key={v} role="tab" aria-selected={on} tabIndex={0}
            onClick={on?undefined:()=>onChange(v)}
            onKeyDown={e=>{ if((e.key==='Enter'||e.key===' ') && !on){ e.preventDefault(); onChange(v); } }}
            style={{flex:1, fontSize:'var(--body-sm-font-size)', lineHeight:'var(--body-sm-line-height)',
              fontWeight:on?500:400, padding:'4px 0', borderRadius:6,
              cursor:on?'default':'pointer', background:on?'var(--bg-overlay-l3)':'transparent',
              color:on?'var(--text-default)':'var(--text-tertiary)',
              display:'flex', alignItems:'center', justifyContent:'center', gap:4,
              transition:'background .12s ease, color .12s ease'}}>
            {label}{extra}
          </div>
        );
      })}
    </div>
  );
}

/* 文件类型字母块（type-first 分类色：md=info · html=coral · json=amber） */
function FileIco({type}) {
  const map = {
    md:   {g:'M',   c:'var(--status-primary-default)', sf:'var(--status-primary-surface-l1)', fs:9},
    html: {g:'</>', c:'var(--accent-coral)', sf:'color-mix(in srgb, var(--accent-coral) 12%, transparent)', fs:6.5, mono:true},
    json: {g:'{}',  c:'var(--accent-amber)', sf:'color-mix(in srgb, var(--accent-amber) 12%, transparent)', fs:8, mono:true},
  };
  const m = map[type] || {g:'·', c:'var(--text-tertiary)', sf:'transparent', fs:9};
  return (
    <span style={{width:15, height:15, borderRadius:4, background:m.sf, color:m.c, fontSize:m.fs,
      fontWeight:600, display:'inline-flex', alignItems:'center', justifyContent:'center', flexShrink:0,
      fontFamily:m.mono?F.mono:undefined}}>{m.g}</span>
  );
}

/* 产物卡头 */
function ArtHead({file, tags, warn, onOpen}) {
  const name = file.split('/').pop();
  const type = name.endsWith('.html')?'html':(name.includes('.json')?'json':'md');
  return (
    <div style={{display:'flex', alignItems:'center', gap:7, marginBottom:9, flexWrap:'wrap'}}>
      <FileIco type={type}/>
      <span onClick={()=>onOpen && onOpen(name)} title="在产物面板中定位" role="button" tabIndex={0}
        onKeyDown={e=>{ if(e.key==='Enter' && onOpen) onOpen(name); }}
        style={{fontFamily:F.mono, fontSize:'var(--body-md-font-size)', fontWeight:600,
          color: warn?'var(--status-warning-default)':'var(--text-default)', cursor:'pointer',
          borderBottom:'1px dashed var(--border-neutral-l3)'}}>{file}</span>
      {tags.map(t=><Tag key={t} c={warn?'var(--status-warning-default)':undefined}>{t}</Tag>)}
    </div>
  );
}

/* 评审卡（metric 数字字体 · 语义进度条 · 状态 surface 提示框） */

  const avg = pass?6.4:5.8;
  const passC = 'var(--status-success-default)', failC = 'var(--status-error-default)';
  return (
    <AgentShell stage="review" time={pass?'15:34':'15:20'}>
      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
        <span style={{fontSize:24, fontWeight:600, fontFamily:F.metric, lineHeight:1,
          color: pass ? passC : failC}}>{avg.toFixed(1)}</span>
        <div>
          <div style={{fontSize:'var(--body-md-font-size)', fontWeight:600, color: pass ? passC : failC}}>
            {pass?'✓ 复审通过（≥6）':'✗ 未过门禁（< 6）'}
          </div>
          <div style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)'}}>独立评审（未注入 ③④ 生成上下文） · 打回 {pass?'1':'0'}/2 次</div>
        </div>

      </div>
      {dims.map(([k,v])=>(
        <div key={k} style={{display:'flex', alignItems:'center', gap:8, marginBottom:5}}>
          <span style={{fontSize:'var(--body-sm-font-size)', width:68, flexShrink:0,
            color: v<6 ? failC : 'var(--text-secondary)'}}>{k}</span>
          <div style={{flex:1, height:6, borderRadius:'var(--radius-full)', background:'var(--bg-overlay-l2)', overflow:'hidden'}}>
            <div style={{width:v*10+'%', height:'100%', borderRadius:'inherit',
              background: v<6 ? failC : (v>=7 ? passC : 'var(--status-warning-default)')}}/>
          </div>
          <span style={{fontSize:'var(--body-sm-font-size)', fontFamily:F.mono, width:22, textAlign:'right',
            color: v<6 ? failC : 'var(--text-secondary)'}}>{v}</span>
        </div>
      ))}
      {!pass && (
        <div style={{marginTop:9, padding:'10px 12px', borderRadius:'var(--radius-8)',
          background:'var(--status-error-surface-l1)', border:'1px solid var(--status-error-surface-l2)'}}>
          <div style={{fontSize:'var(--body-sm-font-size)', fontWeight:600, color:failC, marginBottom:3,
            display:'flex', alignItems:'center', gap:5}}>{I('icon-warning-fill',12)}扣分点 · 文档质量 5/10</div>
          <div style={{fontSize:'var(--body-md-font-size)', color:'var(--text-default)', lineHeight:1.6}}>
            非功能需求只有一句话，缺「提醒触达率」验收标准；数据指标没写埋点口径。
            <div style={{color:'var(--text-secondary)', marginTop:2, fontSize:'var(--body-sm-font-size)'}}>建议：按「指标 + 阈值 + 验收方式」三列补齐。</div>

        </div>
      )}
      {pass && (

          <Btn small kind="brand" icon="Lock">封板（git tag + 冻结 + release notes）</Btn>
        </div>
      )}
    </AgentShell>
  );
}

    ? (session.main ? (curTask.key==='widget' ? RUN_WIDGET : RUN_FITNESS) : (session.msgs||[]))
    : (curTask.key==='widget' ? RUN_WIDGET : RUN_FITNESS);
  const ver = curTask.version;
  const render = (m,i) => {
    switch(m.t) {
      case 'user': return (
        <div key={i} style={{display:'flex', justifyContent:'flex-end', marginBottom:16}}>
          <div style={{background:'var(--bg-invert)', color:'var(--text-white)',
            fontSize:'var(--body-base-font-size)', lineHeight:1.55, padding:'9px 14px',

      case 'plan': return <PlanCard key={i}/>;

      case 'radar': return <RadarCard key={i} onOpenPanel={openPanel}/>;
      case 'artifact': return <ArtifactCard key={i} kind={m.kind} ver={m.ver} onOpenFile={onOpenFile}/>;
      case 'review': return <ReviewCard key={i} pass={m.pass}/>;
      case 'done': return <DoneCard key={i}/>;
      case 'chat': return (
        <AgentShell key={i} stage={m.stage} time={m.time}>
          <div style={{fontSize:'var(--body-base-font-size)', color:'var(--text-default)', lineHeight:1.7}}>{m.text}</div>

  };
  return (

        <select value={ver} onChange={e=>setVersion(e.target.value)} aria-label="切换版本"

                onMouseLeave={e=>{ e.currentTarget.style.background='transparent'; e.currentTarget.style.color='var(--icon-tertiary)'; }}>
                {I('Plus',13)}</span>
              <div style={{flex:1, fontSize:'var(--body-md-font-size)', color:'var(--text-tertiary)'}}>
                回复 Agent…（① 每轮只问一个最关键的问题 · Cmd+K 技能）
              </div>
              <Btn small icon="Star">记下来</Btn>
              <span role="button" tabIndex={0} aria-label="发送" title="发送"
                onKeyDown={e=>{ if(e.key==='Enter') e.currentTarget.click(); }}

/* ================= 右侧面板：产物 / 上下文 双 Tab ================= */

            transition:'background .12s ease, color .12s ease'}}

                padding:'4px 0', borderRadius:6, cursor:'pointer', lineHeight:'var(--body-sm-line-height)',
                color:artView===k?'var(--text-default)':'var(--text-tertiary)',

}

/* 目录节点（可折叠） */
function DirNode({node, depth, render}) {
  const [open, setOpen] = React.useState(node.open!==false);
  return (
    <div>
      <div onClick={()=>setOpen(!open)} role="button" tabIndex={0}
        onKeyDown={e=>{ if(e.key==='Enter') setOpen(!open); }}
        style={{display:'flex', alignItems:'center', gap:5, padding:'3px 6px',
          borderRadius:5, cursor:'pointer', paddingLeft:6+depth*13, transition:'background .12s ease'}}
        onMouseEnter={e=>e.currentTarget.style.background='var(--bg-overlay-l1)'}
        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
        <Chev open={open} size={7}/>
        {I('Folder',12,{color:'var(--icon-tertiary)'})}
        <span style={{fontFamily:F.mono, fontSize:'var(--body-sm-font-size)', fontWeight:600, color:'var(--text-secondary)'}}>{node.dir}</span>
      </div>
      {open && node.children.map(c=>render(c, depth+1))}
    </div>
  );
}

  const outline = OUTLINES[selectedFile] || null;

  const renderNode = (node, depth) => {
    if (node.f) {
      const sel = node.f===selectedFile;
      return (
        <div key={node.f} onClick={()=>onSelectFile(node.f)} title={node.meta} role="button" tabIndex={0}
          onKeyDown={e=>{ if(e.key==='Enter') onSelectFile(node.f); }}
          style={{display:'flex', alignItems:'center', gap:6, padding:'3px 6px', borderRadius:5, cursor:'pointer',
            background:sel?'var(--bg-overlay-l2)':'transparent', paddingLeft:6+depth*13, transition:'background .12s ease'}}

            {I(ic,12)}</span>

        <span style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)', marginLeft:'auto'}}>文件是唯一事实源</span>

      {/* 文件树 */}

          <Chev open={outlineOpen} size={7}/>

            color:'var(--text-tertiary)', fontFamily:F.mono}}>

      {/* 底部操作 */}
      <div style={{padding:'0 12px 12px', display:'flex', gap:7}}>

        <Btn small kind="ghost">重建索引</Btn>
      </div>

  );

/* ---- 产物面板 · 视图二：按阶段（design.md §4） ---- */
function StageArtifactsPanel({pKey, onLocate}) {
  const list = STAGE_ARTIFACTS[pKey];
  const [open, setOpen] = React.useState(
    ()=>Object.fromEntries(list.map(s=>[s.s, s.files.length>0 || !!s.running])));
  const [decF, setDecF] = React.useState(null); // 决策日志弹窗：null=关闭 / 'run' / 'all' / 阶段 key
  const decAll = (DECISIONS[pKey]||[]).length;
  const runDec = (DECISIONS[pKey]||[]).filter(d=>d.s==='run').length;
  return (
    <div style={{flex:1, overflowY:'auto', padding:'2px 10px 12px', display:'flex', flexDirection:'column', gap:6}}>
      <div style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)', padding:'0 2px'}}>
        每阶段完成 = 产物落盘 + 纪要 + 知识点抽取 + 决策写入 · 点击文件在文件树中定位
      </div>
      {/* 决策日志入口（FR7 · 五要素 · A14） */}
      <div onClick={()=>setDecF('run')} role="button" tabIndex={0} aria-label="打开决策日志"
        onKeyDown={e=>{ if(e.key==='Enter') setDecF('run'); }}
        style={{display:'flex', alignItems:'center', gap:7, padding:'7px 10px', borderRadius:'var(--radius-8)',
          background:'var(--bg-brand-popup)', border:'1px solid color-mix(in srgb, var(--bg-brand) 25%, transparent)',
          cursor:'pointer', transition:'background .12s ease'}}
        onMouseEnter={e=>e.currentTarget.style.background='color-mix(in srgb, var(--bg-brand) 16%, transparent)'}
        onMouseLeave={e=>e.currentTarget.style.background='var(--bg-brand-popup)'}>
        {I('doc',13,{color:'var(--text-brand)'})}
        <span style={{flex:1, fontSize:'var(--body-sm-font-size)', fontWeight:600, color:'var(--text-brand)'}}>决策日志 · 五要素详情</span>
        <span style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-secondary)'}}>本会话 {runDec} · 累计 {decAll}</span>
        <span style={{transform:'rotate(0deg)', display:'inline-flex'}}>{I('Collapse-triangle',9,{color:'var(--text-brand)'})}</span>
      </div>
      {list.map(seg=>{
        const st = STAGES[seg.s];
        const isOpen = open[seg.s];
        const ftype = f => f.endsWith('.html')?'html':(f.includes('.json')?'json':'md');
        return (
          <div key={seg.s} style={{borderRadius:'var(--radius-8)', background:'var(--bg-overlay-l1)',
            overflow:'hidden', opacity:(!seg.files.length && !seg.running)?0.55:1}}>
            {/* 阶段头 */}
            <div onClick={()=>setOpen({...open, [seg.s]:!isOpen})} role="button" tabIndex={0}
              onKeyDown={e=>{ if(e.key==='Enter') setOpen({...open, [seg.s]:!isOpen}); }}
              style={{display:'flex', alignItems:'center', gap:7, padding:'6px 8px', cursor:'pointer',
                transition:'background .12s ease'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--bg-overlay-l1)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <Avatar stage={seg.s} size={18}/>
              <span style={{fontSize:'var(--body-sm-font-size)', fontWeight:600, color:'var(--text-default)'}}>{st.name}</span>
              {seg.running
                ? <Tag v="brand">● 运行中</Tag>
                : seg.files.length
                  ? <Tag v="success">✓ {seg.files.length} 产物</Tag>
                  : <Tag>未开始</Tag>}
              <span style={{marginLeft:'auto', display:'inline-flex', width:8, flexShrink:0,
                color:'var(--icon-tertiary)', transform:isOpen?'rotate(90deg)':'none', transition:'transform .15s ease'}}>
                {I('Collapse-triangle',8)}</span>
            </div>
            {/* 阶段体 */}
            {isOpen && (
              <div className="fadein" style={{padding:'1px 8px 7px'}}>
                {seg.files.length
                  ? seg.files.map(fl=>(
                      <div key={fl.f} onClick={()=>onLocate(fl.f.split('/').pop())} title={fl.meta}
                        role="button" tabIndex={0}
                        onKeyDown={e=>{ if(e.key==='Enter') onLocate(fl.f.split('/').pop()); }}
                        style={{display:'flex', alignItems:'center', gap:6, padding:'3px 5px', borderRadius:5,
                          cursor:'pointer', transition:'background .12s ease'}}
                        onMouseEnter={e=>e.currentTarget.style.background='var(--bg-overlay-l2)'}
                        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                        <FileIco type={ftype(fl.f)}/>
                        <span style={{fontFamily:F.mono, fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)',
                          fontWeight:fl.star?600:400, textDecoration:fl.old?'line-through':'none'}}>
                          {(fl.dir||'')+fl.f}
                        </span>
                        {fl.star && I('Star',9,{color:'var(--accent-amber)'})}
                        <span style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)', marginLeft:'auto',
                          overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis', flexShrink:1}}>{fl.meta}</span>
                      </div>
                    ))
                  : <div style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)', padding:'2px 5px 3px'}}>
                      {seg.running ? (seg.note||'阶段执行中…') : '本阶段尚未产出文件'}
                    </div>}
                {/* 阶段收尾三件事 + 💀登记 */}
                <div style={{display:'flex', gap:4, flexWrap:'wrap', marginTop:5, paddingLeft:2}}>
                  <Tag v={seg.extract!=='—'?'success':undefined}>知识 {seg.extract}</Tag>
                  {seg.decisions>0
                    ? <span onClick={()=>setDecF(seg.s)} role="button" tabIndex={0} title="查看本阶段决策五要素"
                        onKeyDown={e=>{ if(e.key==='Enter') setDecF(seg.s); }}
                        style={{cursor:'pointer'}}>
                        <Tag v="warning">决策 +{seg.decisions} ↗</Tag>
                      </span>
                    : <Tag>决策 +0</Tag>}
                  {seg.risks>0 && <Tag v="danger">💀 登记 {seg.risks}</Tag>}
                  {seg.note && !seg.running && <Tag v="info">{seg.note}</Tag>}
                </div>
              </div>
            )}
          </div>
        );
      })}
      {decF && <DecisionLogModal pKey={pKey} initialFilter={decF} onClose={()=>setDecF(null)}/>}
    </div>
  );
}

/* ---- 决策日志弹窗（FR7 · 五要素齐全 · 💀命中回写 · 覆盖回链 · A14） ---- */
function DecisionLogModal({pKey, initialFilter, onClose}) {
  const all = DECISIONS[pKey]||[];
  const [f, setF] = React.useState(initialFilter||'run');
  const runCount = all.filter(d=>d.s==='run').length;
  const list = f==='all' ? all : (f==='run' ? all.filter(d=>d.s==='run') : all.filter(d=>d.stage===f));
  const stageChips = ['clarify','research','prd'].filter(s=>all.some(d=>d.stage===s));
  const chip = (key,label,count) => (
    <span key={key} onClick={()=>setF(key)} role="button" tabIndex={0}
      onKeyDown={e=>{ if(e.key==='Enter') setF(key); }}
      style={{display:'inline-flex', alignItems:'center', gap:5, height:22, padding:'0 9px', borderRadius:6, cursor:'pointer',
        fontSize:'var(--body-sm-font-size)', fontWeight:500,
        background: f===key ? 'var(--bg-overlay-l3)' : 'var(--bg-overlay-l1)',
        color: f===key ? 'var(--text-default)' : 'var(--text-secondary)',
        border:'1px solid var(--border-neutral-l1)'}}>
      {label}
      <span style={{fontFamily:F.mono, fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)'}}>{count}</span>
    </span>
  );
  return ReactDOM.createPortal(
    <div onClick={onClose} role="button" tabIndex={0} aria-label="点击空白关闭决策日志"
      onKeyDown={e=>{ if(e.key==='Enter') onClose(); }}
      style={{position:'fixed', inset:0, zIndex:200, background:'rgba(23,23,23,0.32)',
        display:'flex', alignItems:'center', justifyContent:'center', padding:24}}>
      <div onClick={e=>e.stopPropagation()} style={{width:620, maxWidth:'100%', maxHeight:'84vh',
        background:'var(--bg-base-default)', borderRadius:'var(--radius-12)',
        border:'1px solid var(--border-neutral-l2)', boxShadow:'0 16px 48px rgba(23,23,23,0.20)',
        display:'flex', flexDirection:'column', overflow:'hidden'}} className="fadein">
        {/* 头 */}
        <div style={{padding:'12px 16px', borderBottom:'1px solid var(--border-neutral-l1)',
          display:'flex', alignItems:'center', gap:8}}>
          {I('doc',14,{color:'var(--text-brand)'})}
          <span style={{fontSize:'var(--body-base-font-size)', fontWeight:600, color:'var(--text-default)'}}>决策日志</span>
          <Tag mono>decisions.jsonl · append-only</Tag>
          <span onClick={onClose} role="button" tabIndex={0} aria-label="关闭"
            onKeyDown={e=>{ if(e.key==='Enter') onClose(); }}
            style={{marginLeft:'auto', width:24, height:24, display:'flex', alignItems:'center', justifyContent:'center',
              color:'var(--icon-tertiary)', cursor:'pointer', borderRadius:6}}
            onMouseEnter={e=>{e.currentTarget.style.background='var(--bg-overlay-l2)'; e.currentTarget.style.color='var(--icon-default)';}}
            onMouseLeave={e=>{e.currentTarget.style.background='transparent'; e.currentTarget.style.color='var(--icon-tertiary)';}}>
            {I('Close',13)}
          </span>
        </div>
        {/* 筛选 */}
        <div style={{padding:'9px 16px 0', display:'flex', gap:5, flexWrap:'wrap'}}>
          {chip('run','本会话',runCount)}
          {chip('all','全部',all.length)}
          {stageChips.map(s=>chip(s, {clarify:'① 澄清',research:'② 调研',prd:'③ PRD'}[s],
            all.filter(d=>d.stage===s).length))}
        </div>
        {/* 列表 */}
        <div style={{flex:1, overflowY:'auto', padding:'10px 16px 14px'}}>
          {list.map(d=><DecisionCard key={d.id} d={d}/>)}
          {!list.length && <div style={{padding:'28px 0', textAlign:'center', color:'var(--text-tertiary)',
            fontSize:'var(--body-md-font-size)'}}>当前筛选下无决策</div>}
        </div>
        {/* 脚注 */}
        <div style={{padding:'7px 16px', borderTop:'1px solid var(--border-neutral-l1)',
          fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)'}}>
          五要素：决策 / WHY / 排除方案 + 机会成本 / 置信度 / 待验证 · 未闭环「待验证」高亮（A14）
        </div>
      </div>
    </div>,
    document.body
  );
}

/* 单条决策卡（五要素逐行展开） */
function DecisionCard({d}) {
  const SNAME = {clarify:'① 澄清', research:'② 调研', prd:'③ PRD', proto:'④ 原型', review:'⑤ 评审'};
  const confV = {高:'success', 中:'warning', 低:'danger'}[d.conf];
  const lbl = {width:44, flexShrink:0, fontSize:'var(--body-xs-font-size)', fontWeight:600,
    color:'var(--text-tertiary)', paddingTop:2};
  const val = {flex:1, fontSize:'var(--body-sm-font-size)', lineHeight:1.55, color:'var(--text-secondary)'};
  return (
    <div style={{padding:'10px 12px 8px', marginBottom:8, borderRadius:'var(--radius-8)',
      background: d.riskHit ? 'var(--status-error-surface-l1)' : 'var(--bg-overlay-l1)',
      border:'1px solid '+(d.riskHit ? 'var(--status-error-surface-l2)' : 'var(--border-neutral-l1)')}}>
      {/* 卡头：id + 阶段/会话标签 + 时间 */}
      <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:5, flexWrap:'wrap'}}>
        <span style={{fontFamily:F.mono, fontSize:'var(--body-sm-font-size)', fontWeight:600,
          color: d.riskHit ? 'var(--status-error-default)' : 'var(--text-default)'}}>{d.id}</span>
        {d.riskHit && <Tag v="danger">💀 命中回写</Tag>}
        <Tag>{SNAME[d.stage]}</Tag>
        {d.s==='qa' && <Tag v="info">追问会话</Tag>}
        {d.s==='v10' && <Tag>v1.0 封存</Tag>}
        <span style={{marginLeft:'auto', fontFamily:F.mono, fontSize:'var(--body-xs-font-size)',
          color:'var(--text-tertiary)'}}>{d.time}</span>
      </div>
      <div style={{fontSize:'var(--body-md-font-size)', fontWeight:600, color:'var(--text-default)', marginBottom:6}}>
        {d.title}
      </div>
      {/* 五要素 */}
      <div style={{display:'flex', gap:8, marginBottom:3}}>
        <span style={lbl}>WHY</span>
        <div style={val}>{d.why}</div>
      </div>
      {d.exc && d.exc!=='—' && (
        <div style={{display:'flex', gap:8, marginBottom:3}}>
          <span style={lbl}>排除</span>
          <div style={val}>{d.exc}
            {d.oc && d.oc!=='—' && <span style={{color:'var(--text-tertiary)'}}>　机会成本：{d.oc}</span>}
          </div>
        </div>
      )}
      {d.actual && (
        <div style={{display:'flex', gap:8, marginBottom:3}}>
          <span style={lbl}>实际</span>
          <div style={{...val, color:'var(--status-error-default)'}}>{d.actual}</div>
        </div>
      )}
      <div style={{display:'flex', gap:8, alignItems:'flex-start', marginBottom:d.covers?3:0}}>
        <span style={lbl}>置信度</span>
        <div style={{flex:1, display:'flex', gap:6, alignItems:'baseline', flexWrap:'wrap'}}>
          {d.conf!=='—' ? <Tag v={confV}>{d.conf}</Tag> : <Tag>—</Tag>}
          <span style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)'}}>待验证：</span>
          <span style={{fontSize:'var(--body-sm-font-size)',
            color: d.done ? 'var(--status-success-default)' : 'var(--status-warning-default)',
            fontWeight: d.done ? 400 : 600}}>{d.todo}{d.done ? ' ✓' : ''}</span>
        </div>
      </div>
      {d.covers && (
        <div style={{marginTop:6, paddingTop:5, borderTop:'1px dashed var(--border-neutral-l2)',
          fontSize:'var(--body-xs-font-size)', color:'var(--status-primary-default)'}}>
          ↳ 覆盖旧结论：{d.covers}（失效留回链 · 不物理删除）
        </div>
      )}
    </div>
  );
}

/* ---- 决策日志页面（左栏入口 · FR7 · 五要素 append-only · A13/A14/E14） ---- */
function DecisionLogPage() {
  const [filter, setFilter] = React.useState('all');      // all | fitness | widget
  const [status, setStatus] = React.useState('all');      // all | open | done | hit | cover
  const [query, setQuery] = React.useState('');
  const [raw, setRaw] = React.useState(false);            // 卡片视图 / decisions.jsonl 原文
  const [closed, setClosed] = React.useState({});         // 待验证闭环（追加记录 · 原条目不改写）
  const [toast, setToast] = React.useState('');
  const timer = React.useRef(null);
  const say = t => { setToast(t); clearTimeout(timer.current);
    timer.current = setTimeout(()=>setToast(''), 2600); };

  const PROJ = [['fitness','我的健身App'], ['widget','WidgetToDo']];
  const isDone = d => d.done || closed[d.pk+'/'+d.id];
  const all = PROJ.flatMap(([pk])=>(DECISIONS[pk]||[]).map(d=>({...d, pk})));
  const stat = {
    total: all.length,
    open: all.filter(d=>!isDone(d)).length,
    done: all.filter(d=>isDone(d)).length,
    hit: all.filter(d=>d.riskHit).length,
    cover: all.filter(d=>d.covers).length,
  };
  const hitQ = d => !query.trim() || d.title.includes(query.trim())
    || d.why.includes(query.trim()) || (d.exc||'').includes(query.trim());
  const hitS = d => status==='all' ? true
    : status==='open' ? !isDone(d)
    : status==='done' ? isDone(d)
    : status==='hit' ? !!d.riskHit : !!d.covers;
  const groups = (filter==='all' ? PROJ : PROJ.filter(([pk])=>pk===filter))
    .map(([pk,label])=>[label, all.filter(d=>d.pk===pk && hitS(d) && hitQ(d))]);
  const empty = groups.every(([,l])=>l.length===0);

  const closeIt = d => { setClosed(m=>({...m, [d.pk+'/'+d.id]:true}));
    say('闭环记录已追加 · append-only 不改写原条目（A14/E14）'); };
  /* design.md §5.2 schema：每行一条 JSON · risk_hit 为第 6 种条目 */
  const jsonlOf = d => JSON.stringify({
    id:d.id, version:d.s==='v10'?'v1.0':(d.pk==='widget'?'v0.3':'v1.1'), stage:d.stage,
    decision:d.title, why:d.why,
    rejectedAlternatives:(d.exc && d.exc!=='—')?[d.oc && d.oc!=='—'?{option:d.exc, opportunityCost:d.oc}:{option:d.exc}]:[],
    confidence:d.conf, toBeVerified:!isDone(d),
    ...(d.riskHit?{type:'risk_hit', riskId:'r_002', predicted:d.why, actual:d.actual}:{}),
    ...(d.covers?{covers:d.covers}:{})});

  const chip = (key,label,count)=>(
    <span key={key} onClick={()=>setStatus(key)} role="button" tabIndex={0}
      onKeyDown={e=>{ if(e.key==='Enter') setStatus(key); }}
      style={{display:'inline-flex', alignItems:'center', gap:5, height:22, padding:'0 9px', borderRadius:6,
        cursor:'pointer', fontSize:'var(--body-sm-font-size)', fontWeight:500,
        background: status===key ? 'var(--bg-overlay-l3)' : 'var(--bg-overlay-l1)',
        color: status===key ? 'var(--text-default)' : 'var(--text-secondary)',
        border:'1px solid var(--border-neutral-l1)'}}>
      {label}
      <span style={{fontFamily:F.mono, fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)'}}>{count}</span>
    </span>
  );
  const emptyBox = (
    <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-tertiary)', padding:'24px 0',
      textAlign:'center', border:'1px dashed var(--border-neutral-l1)', borderRadius:'var(--radius-10)'}}>
      没有匹配「{query.trim() || '当前筛选'}」的决策
    </div>
  );

  return (
    <div style={{flex:1, minWidth:0, background:'var(--bg-base-default)', display:'flex',
      flexDirection:'column', position:'relative'}}>
      {/* 头部 */}
      <div style={{padding:'24px 34px 0', flexShrink:0}}>
        <div style={{display:'flex', alignItems:'flex-start', marginBottom:16, gap:16}}>
          <div>
            <div style={{fontSize:'var(--heading-md-font-size)', lineHeight:'var(--heading-md-line-height)',
              fontWeight:600, color:'var(--text-default)', marginBottom:4}}>决策日志</div>
            <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)'}}>
              每条决策五要素 · append-only 永不删除 · v1.1 推翻 v1.0 可回看「为什么变」（A13）
            </div>
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:9, alignItems:'center'}}>
            <SearchInput value={query} onChange={e=>setQuery(e.target.value)}
              placeholder="搜索决策 / WHY / 排除方案" width={230}/>
            <Btn icon="doc" onClick={()=>setRaw(!raw)} title="卡片 / decisions.jsonl 原文切换">
              {raw?'卡片视图':'JSONL 原文'}
            </Btn>
          </div>
        </div>
        {/* 项目筛选 + 概览 */}
        <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6, flexWrap:'wrap'}}>
          <Pill on={filter==='all'} onClick={()=>setFilter('all')}>全部 {stat.total}</Pill>
          {PROJ.map(([pk,label])=>(
            <Pill key={pk} on={filter===pk} onClick={()=>setFilter(pk)}>{label} {(DECISIONS[pk]||[]).length}</Pill>
          ))}
          <div style={{marginLeft:'auto', fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)'}}>
            未闭环 {stat.open} · 💀命中回写 ×{stat.hit} · 推翻覆盖 ×{stat.cover} · 不可删除（A14）
          </div>
        </div>
        {/* 状态筛选 */}
        <div style={{display:'flex', gap:5, flexWrap:'wrap', paddingBottom:4}}>
          {chip('all','全部',stat.total)}
          {chip('open','待验证未闭环',stat.open)}
          {chip('done','已闭环',stat.done)}
          {chip('hit','💀 命中回写',stat.hit)}
          {chip('cover','覆盖回链',stat.cover)}
        </div>
      </div>
      {/* 列表 */}
      <div style={{flex:1, overflowY:'auto', padding:'10px 34px 26px'}}>
        {raw ? (
          <div>
            {groups.map(([label, list])=> list.length>0 && (
              <div key={label} style={{marginBottom:14}}>
                <div style={{fontSize:'var(--body-sm-font-size)', fontWeight:600, color:'var(--text-tertiary)',
                  margin:'8px 0 6px', fontFamily:F.mono}}>{label}/decisions.jsonl · append-only</div>
                <div style={{borderRadius:'var(--radius-8)', border:'1px solid var(--border-neutral-l1)',
                  background:'var(--bg-base-secondary)', padding:'8px 0', overflowX:'auto'}}>
                  {list.map((d,i)=>(
                    <div key={d.pk+'_'+d.id} style={{display:'flex', gap:9, padding:'3px 12px',
                      fontFamily:F.mono, fontSize:'var(--body-xs-font-size)', lineHeight:1.6,
                      whiteSpace:'pre', minWidth:'max-content'}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--bg-overlay-l1)'}
                      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      <span style={{color:'var(--text-tertiary)', textAlign:'right', width:22, flexShrink:0}}>{i+1}</span>
                      <span style={{color:'var(--status-success-default)', fontWeight:600}}>+</span>
                      <span style={{color: d.riskHit?'var(--status-error-default)':'var(--text-secondary)'}}>{jsonlOf(d)}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
            {empty ? emptyBox : (
              <div style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)', marginTop:2}}>
                每行一条 JSON · 只在尾部追加（+）· 不改写 · 不删除 · 💀命中回写为第 6 种条目（risk_hit）
              </div>
            )}
          </div>
        ) : (
          <div>
            {groups.map(([label, list])=>(
              <div key={label} style={{marginBottom:6}}>
                <div style={{fontSize:'var(--body-sm-font-size)', fontWeight:600,
                  color:'var(--text-tertiary)', margin:'8px 0'}}>{label}</div>
                {list.map(d=>(
                  <div key={d.pk+'_'+d.id}>
                    <DecisionCard d={{...d, done:isDone(d)}}/>
                    {!isDone(d) && (
                      <div style={{display:'flex', alignItems:'center', gap:8, marginTop:-2, marginBottom:8, paddingLeft:2}}>
                        <Btn small onClick={()=>closeIt(d)}>验证闭环 · 追加记录</Btn>
                        <span style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)'}}>
                          未闭环条目高亮（A14）· 闭环以追加方式落盘，原条目不改写
                        </span>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            ))}
            {empty && emptyBox}
            <div style={{marginTop:16, padding:'10px 14px', borderRadius:'var(--radius-10)',
              border:'1px dashed var(--border-neutral-l1)', fontSize:'var(--body-xs-font-size)',
              color:'var(--text-tertiary)', lineHeight:1.7}}>
              记什么：关键决策判据——跨阶段影响 / 不可逆 / 真实备选方案，满足任一记全五要素，其余一句话 WHY（防琐碎全记，也防漏记）·
              决策由阶段收尾自动写入，无手动新建 · 💀 风险命中由状态机结算并自动回写（预测 vs 实际）·
              推翻旧决策 = 新条目覆盖 + 旧条目失效留回链（E14/A14）
            </div>
          </div>
        )}
      </div>
      {/* 操作反馈 */}
      {toast && (
        <div className="fadein" role="status" style={{position:'absolute', bottom:22, left:'50%',
          transform:'translateX(-50%)', background:'var(--bg-base-default)',
          border:'1px solid var(--border-neutral-l2)', borderRadius:8, padding:'8px 16px',
          fontSize:'var(--body-sm-font-size)', color:'var(--text-default)',
          boxShadow:'0 12px 32px color-mix(in srgb, var(--text-default) 16%, transparent)',
          whiteSpace:'nowrap', zIndex:80}}>
          {toast}
        </div>
      )}
    </div>
  );
}

/* ---- 产物面板 · 视图三：交接（design.md §7） ---- */
function HandoffPanel({pKey}) {

  const [sealed, setSealed] = React.useState(false); // 演示：封板动作

            {[

              ['r_002','已命中 → 回写决策日志 d_006','hit'],

                <span style={{color: st==='hit'?'var(--status-error-default)':'var(--text-tertiary)'}}>{s}</span>

            <div style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)', marginTop:3}}>每条 💀 有始有终 · 悬空口径闭合（A16a）</div>
          </div>

        </div>

      {/* 不可变文件 */}

/* 搜索输入（ds-input 形制：白底 · 聚焦 contrast 边） */

/* 通用弹窗外壳（ds-dialog 形制：白底 · radius-12 · neutral-l2 边 · 对话框阴影） */
function Modal({title, onClose, width=430, children}) {

    <div onClick={onClose} style={{position:'absolute', inset:0, background:'var(--bg-overlay-l4)',
      display:'flex', alignItems:'center', justifyContent:'center', zIndex:60}}>

        style={{width, maxWidth:'92%', background:'var(--bg-base-default)',
          border:'1px solid var(--border-neutral-l2)', borderRadius:'var(--radius-12)', padding:'20px 22px',
          boxShadow:'0 24px 64px color-mix(in srgb, var(--text-default) 14%, transparent), 0 4px 16px color-mix(in srgb, var(--text-default) 8%, transparent)'}}>
        <div style={{display:'flex', alignItems:'center', marginBottom:14}}>
          <span style={{fontSize:'var(--heading-sm-font-size)', lineHeight:'var(--heading-sm-line-height)',
            fontWeight:600, color:'var(--text-default)'}}>{title}</span>
          <span onClick={onClose} role="button" tabIndex={0} aria-label="关闭" title="关闭"
            onKeyDown={e=>{ if(e.key==='Enter') onClose(); }}
            style={{marginLeft:'auto', width:24, height:24, display:'flex', alignItems:'center',

            onMouseLeave={e=>{ e.currentTarget.style.background='transparent'; e.currentTarget.style.color='var(--icon-tertiary)'; }}>
            {I('Close',13)}</span>
        </div>

}

function SkillLibrary({skills, setSkills}) {
  const [filter, setFilter] = React.useState('all');          // all | market | personal
  const [query, setQuery] = React.useState('');
  const [delTarget, setDelTarget] = React.useState(null);     // 待删除技能
  const [uploadOpen, setUploadOpen] = React.useState(false);
  const [uploadName, setUploadName] = React.useState('');
  const [uploading, setUploading] = React.useState(false);

  const market = skills.filter(s=>s.src==='market');
  const personal = skills.filter(s=>s.src==='personal');
  const enabled = skills.filter(s=>s.on).length;
  const totalUses = skills.reduce((a,s)=>a+s.uses, 0);
  const hit = s => !query.trim() || s.name.includes(query.trim()) || s.desc.includes(query.trim());

  const toggle = id => setSkills(list=>list.map(s=>s.id===id?{...s, on:!s.on}:s));
  const del = () => { setSkills(list=>list.filter(s=>s.id!==delTarget.id)); setDelTarget(null); };
  const doUpload = () => {
    setUploading(true);
    setTimeout(()=>{
      setSkills(list=>[...list, {id:Date.now(), ic:'file-upload', src:'personal', on:true, uses:0,
        name:uploadName.trim()||'我的自定义技能',
        desc:'个人上传 · skill.yaml 已解析 · 1 个触发词 / 2 个资源文件。'}]);
      setUploading(false); setUploadOpen(false); setUploadName('');
    }, 900);
  };

  const groups = filter==='personal' ? [['个人上传', personal]]
               : filter==='market'   ? [['来自市场', market]]
               : [['来自市场', market], ['个人上传', personal]];

  return (
    <div style={{flex:1, minWidth:0, background:'var(--bg-base-default)', display:'flex',
      flexDirection:'column', position:'relative'}}>
      {/* 头部 */}
      <div style={{padding:'24px 34px 0', flexShrink:0}}>
        <div style={{display:'flex', alignItems:'flex-start', marginBottom:16, gap:16}}>
          <div>
            <div style={{fontSize:'var(--heading-md-font-size)', lineHeight:'var(--heading-md-line-height)',
              fontWeight:600, color:'var(--text-default)', marginBottom:4}}>技能库</div>
            <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)'}}>
              管理已添加的技能 · Agent 按五阶段自动路由，技能通过 skill.yaml 声明触发词
            </div>
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:9, alignItems:'center'}}>
            <SearchInput value={query} onChange={e=>setQuery(e.target.value)} placeholder="搜索技能"/>
            <Btn kind="brand" icon="Plus" onClick={()=>setUploadOpen(true)}>上传技能</Btn>
          </div>
        </div>
        {/* 筛选 + 概览 */}
        <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6, flexWrap:'wrap'}}>
          <Pill on={filter==='all'} onClick={()=>setFilter('all')}>全部 {skills.length}</Pill>
          <Pill on={filter==='market'} onClick={()=>setFilter('market')}>来自市场 {market.length}</Pill>
          <Pill on={filter==='personal'} onClick={()=>setFilter('personal')}>个人 {personal.length}</Pill>
          <div style={{marginLeft:'auto', fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)'}}>
            已启用 {enabled}/{skills.length} · 累计调用 {totalUses} 次 · 市场技能随上游更新 · 个人技能仅本地可见
          </div>
        </div>
      </div>
      {/* 列表 */}
      <div style={{flex:1, overflowY:'auto', padding:'10px 34px 26px'}}>
        {groups.map(([label, list])=>(
          <div key={label} style={{marginBottom:6}}>
            <div style={{fontSize:'var(--body-sm-font-size)', fontWeight:600, color:'var(--text-tertiary)', margin:'8px 0'}}>{label}</div>
            {list.filter(hit).map(s=>(
              <SkillCard key={s.id} s={s} onToggle={toggle} onDelete={setDelTarget}/>
            ))}
            {label==='个人上传' && list.filter(hit).length===0 && (
              <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-tertiary)', padding:'18px 0',
                textAlign:'center', border:'1px dashed var(--border-neutral-l1)', borderRadius:'var(--radius-10)'}}>
                {personal.length===0 ? '还没有个人技能 · 点击右上「上传技能」添加' : '没有匹配「'+query.trim()+'」的个人技能'}
              </div>
            )}
          </div>
        ))}
        {groups.every(([,l])=>l.filter(hit).length===0) && groups.length===1 && filter!=='personal' && (
          <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-tertiary)', padding:'24px 0',
            textAlign:'center', border:'1px dashed var(--border-neutral-l1)', borderRadius:'var(--radius-10)'}}>
            没有匹配「{query.trim()}」的技能
          </div>
        )}
      </div>
      {/* 删除确认 */}
      {delTarget && (
        <Modal title="删除技能" onClose={()=>setDelTarget(null)}>
          <div style={{fontSize:'var(--body-base-font-size)', color:'var(--text-default)', marginBottom:6}}>确定删除「{delTarget.name}」？</div>
          <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)', lineHeight:1.6, marginBottom:18}}>
            删除后 Agent 将不再路由该技能；{delTarget.src==='market'?'市场技能可随时重新添加，':'个人技能删除后不可恢复，'}历史产物不受影响。
          </div>
          <div style={{display:'flex', justifyContent:'flex-end', gap:8}}>
            <Btn onClick={()=>setDelTarget(null)}>取消</Btn>
            <Btn kind="danger" onClick={del}>确认删除</Btn>
          </div>
        </Modal>
      )}
      {/* 上传弹窗 */}
      {uploadOpen && (
        <Modal title="上传技能" onClose={()=>!uploading&&setUploadOpen(false)}>
          <div onClick={()=>!uploading&&setUploadName(n=>n||'')} role="button" tabIndex={0}
            onKeyDown={e=>{ if(e.key==='Enter' && !uploading) setUploadName(n=>n||''); }}
            style={{border:'1.5px dashed var(--border-neutral-l2)', borderRadius:'var(--radius-10)',
              padding:'22px 0', textAlign:'center', marginBottom:14,
              cursor:uploading?'default':'pointer', background:'var(--bg-base-secondary)'}}>
            <div style={{display:'flex', justifyContent:'center', marginBottom:6, color:'var(--icon-secondary)'}}>
              {uploading ? I('clock_time',22) : I('file-upload',22)}</div>
            <div style={{fontSize:'var(--body-md-font-size)', color:'var(--text-default)', marginBottom:3}}>
              {uploading ? '正在解析 skill.yaml …' : '拖入 .zip 或包含 skill.yaml 的文件夹'}
            </div>
            <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-tertiary)'}}>
              {uploading ? '识别触发词与资源文件' : '或点击选择文件 · 上传后仅本项目可用'}
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)', marginBottom:6}}>技能名称</div>
            <input value={uploadName} disabled={uploading} onChange={e=>setUploadName(e.target.value)}
              placeholder="例如：竞品价格监控" aria-label="技能名称"
              style={{width:'100%', background:'var(--bg-base-default)', border:'1px solid var(--border-neutral-l1)',
                borderRadius:8, padding:'7px 11px', color:'var(--text-default)', fontSize:'var(--body-md-font-size)',
                outline:'none', fontFamily:'inherit'}}/>
          </div>
          <div style={{display:'flex', justifyContent:'flex-end', gap:8}}>
            <Btn onClick={()=>setUploadOpen(false)} disabled={uploading}>取消</Btn>
            <Btn kind="brand" onClick={doUpload} disabled={uploading}>{uploading?'解析中…':'解析并添加'}</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= 知识库（知识与技能层 · 卡片库） =================

/* 作用域字块（type-first：首字代替 emoji，颜色走语义 surface） */
function ScopeBlock({scope, size=34, fs=13}) {
  const m = SCOPE_META[scope];
  return (
    <div style={{width:size, height:size, borderRadius:'var(--radius-8)', flexShrink:0,
      display:'flex', alignItems:'center', justifyContent:'center',
      background:m.sf, color:m.c, fontSize:fs, fontWeight:600, lineHeight:1}}>{m.L}</div>
  );
}

/* ---- 卡片行 ---- */
function KnowledgeCard({c, onOpen}) {
  const m = SCOPE_META[c.scope];
  return (
    <div onClick={()=>onOpen(c)} className="fadein" role="button" tabIndex={0}
      onKeyDown={e=>{ if(e.key==='Enter') onOpen(c); }}
      style={{display:'flex', alignItems:'center', gap:12, padding:'11px 14px',
        background:'var(--bg-base-secondary)', border:'1px solid var(--border-neutral-l1)',
        borderRadius:'var(--radius-10)', marginBottom:8, cursor:'pointer',
        transition:'background .12s ease, border-color .12s ease', opacity:c.dead?0.5:1}}
      onMouseEnter={e=>{ e.currentTarget.style.background='var(--bg-overlay-l1)'; e.currentTarget.style.borderColor='var(--border-neutral-l2)'; }}
      onMouseLeave={e=>{ e.currentTarget.style.background='var(--bg-base-secondary)'; e.currentTarget.style.borderColor='var(--border-neutral-l1)'; }}>
      <ScopeBlock scope={c.scope}/>
      <div style={{flex:1, minWidth:0}}>
        <div style={{display:'flex', alignItems:'center', gap:7, marginBottom:2, flexWrap:'wrap'}}>
          <span style={{fontSize:'var(--body-md-font-size)', fontWeight:600,
            color:c.dead?'var(--text-tertiary)':'var(--text-default)',
            textDecoration:c.dead?'line-through':'none'}}>{c.name}</span>
          <Tag c={m.c} bg={m.sf}>{m.label}</Tag>
          {c.dead && <Tag>已失效</Tag>}
        </div>
        <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)', lineHeight:1.5,
          overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis'}}>{c.desc}</div>
        <div style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)', marginTop:3}}>
          出处 {c.src} · 关联 {c.linked.length} 张 · 命中 {c.hits} 次
        </div>
      </div>
    </div>
  );
}

function KnowledgeLibrary({cards, setCards}) {
  const [filter, setFilter] = React.useState('all');          // all | global | fitness | widget
  const [query, setQuery] = React.useState('');
  const [detailId, setDetailId] = React.useState(null);        // 查看卡片
  const [addOpen, setAddOpen] = React.useState(false);         // 「记下来」新建
  const [draft, setDraft] = React.useState({name:'', desc:'', scope:'global'});
  const [mergeOld, setMergeOld] = React.useState(null);        // 相似卡片合并目标
  const [toast, setToast] = React.useState('');
  const timer = React.useRef(null);
  const say = t => { setToast(t); clearTimeout(timer.current);
    timer.current = setTimeout(()=>setToast(''), 2600); };

  const detail = cards.find(c=>c.id===detailId);
  const byScope = k => cards.filter(c=>c.scope===k);
  const totalHits = cards.reduce((a,c)=>a+c.hits, 0);
  const weekNew = cards.filter(c=>c.time>='09-06').length;
  const hit = c => !query.trim() || c.name.includes(query.trim()) || c.desc.includes(query.trim());
  const groups = filter==='all'
    ? [['全局', byScope('global')], ['我的健身App', byScope('fitness')], ['WidgetToDo', byScope('widget')]]
    : [[SCOPE_META[filter].label, cards.filter(c=>c.scope===filter)]];

  /* 相似度：2-gram 重合度（演示用，真实实现为 embedding 余弦） */
  const bigrams = s => { const t=String(s).replace(/[\s，。、·：:；;（）()「」《》/<>\-—]/g,'');
    const r=new Set(); for(let i=0;i<t.length-1;i++) r.add(t.slice(i,i+2)); return [...r]; };
  const simOf = (a,b) => { const A=bigrams(a.name+a.desc), B=bigrams(b.name+b.desc);
    const m=A.filter(g=>B.includes(g)).length;
    return Math.min(0.97, +(0.78+0.06*m).toFixed(2)); };

  const resetDraft = () => { setDraft({name:'', desc:'', scope:'global'}); setAddOpen(false); };
  const doAdd = () => {
    setCards(list=>[{id:'kp_'+(Date.now()%10000), name:draft.name.trim(), desc:draft.desc.trim(),
      scope:draft.scope, src:'手动 · 记下来', srcRef:'知识库 · 手动新建', linked:[], hits:0, time:'09-10'}, ...list]);
    resetDraft();
    say('已写入 cards/ 并同步索引 · 下次对话可被检索（E10）');
  };
  const doMerge = () => {
    const card = mergeOld.card;
    setCards(list=>list.map(c=>c.id===card.id
      ? {...c, desc:draft.desc.trim(), src:card.src+' · 手动记下来'} : c));
    setMergeOld(null); resetDraft();
    say('已合并到「'+card.name+'」· 未另建新卡（>0.92 合并 · E10）');
  };
  const submitAdd = () => {
    if (!draft.name.trim() || !draft.desc.trim()) return;
    let best=null, sim=0;
    cards.forEach(c=>{ if (c.dead) return; const s=simOf(draft, c); if (s>sim) { sim=s; best=c; } });
    if (best && sim>0.92) setMergeOld({card:best, sim});
    else doAdd();
  };
  const toggleDead = c => setCards(list=>list.map(x=>x.id===c.id?{...x, dead:!x.dead}:x));

  return (
    <div style={{flex:1, minWidth:0, background:'var(--bg-base-default)', display:'flex',
      flexDirection:'column', position:'relative'}}>
      {/* 头部 */}
      <div style={{padding:'24px 34px 0', flexShrink:0}}>
        <div style={{display:'flex', alignItems:'flex-start', marginBottom:16, gap:16}}>
          <div>
            <div style={{fontSize:'var(--heading-md-font-size)', lineHeight:'var(--heading-md-line-height)',
              fontWeight:600, color:'var(--text-default)', marginBottom:4}}>知识库</div>
            <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)'}}>
              schema 约束的知识卡片（是什么 · 被检索）· 与技能库（怎么做 · 被调用）同层分库
            </div>
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:9, alignItems:'center'}}>
            <SearchInput value={query} onChange={e=>setQuery(e.target.value)} placeholder="搜索概念名"/>
            <Btn kind="brand" icon="Plus" onClick={()=>setAddOpen(true)}>记下来</Btn>
          </div>
        </div>
        {/* 筛选 + 概览 */}
        <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6, flexWrap:'wrap'}}>
          <Pill on={filter==='all'} onClick={()=>setFilter('all')}>全部 {cards.length}</Pill>
          <Pill on={filter==='global'} onClick={()=>setFilter('global')}>全局 {byScope('global').length}</Pill>
          <Pill on={filter==='fitness'} onClick={()=>setFilter('fitness')}>我的健身App {byScope('fitness').length}</Pill>
          <Pill on={filter==='widget'} onClick={()=>setFilter('widget')}>WidgetToDo {byScope('widget').length}</Pill>
          <div style={{marginLeft:'auto', fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)'}}>
            检索命中累计 {totalHits} 次 · 本周新增 {weekNew} · 同概念 &gt;0.92 自动合并 · 冲突旧卡标失效
          </div>
        </div>
      </div>
      {/* 列表 */}
      <div style={{flex:1, overflowY:'auto', padding:'10px 34px 26px'}}>
        {groups.map(([label, list])=>(
          <div key={label} style={{marginBottom:6}}>
            <div style={{fontSize:'var(--body-sm-font-size)', fontWeight:600, color:'var(--text-tertiary)', margin:'8px 0'}}>{label}</div>
            {list.filter(hit).map(c=>(
              <KnowledgeCard key={c.id} c={c} onOpen={x=>setDetailId(x.id)}/>
            ))}
          </div>
        ))}
        {groups.every(([,l])=>l.filter(hit).length===0) && (
          <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-tertiary)', padding:'24px 0',
            textAlign:'center', border:'1px dashed var(--border-neutral-l1)', borderRadius:'var(--radius-10)'}}>
            没有匹配「{query.trim()}」的知识卡片
          </div>

      </div>
      {/* 卡片详情：四字段 schema · 来源跳转 · 关联卡片 */}

            <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)', marginBottom:6}}>作用域</div>
            <div style={{display:'flex', gap:7, flexWrap:'wrap'}}>
              {Object.entries(SCOPE_META).map(([k,m])=>(
                <Pill key={k} on={draft.scope===k} onClick={()=>setDraft(d=>({...d, scope:k}))}>{m.label}</Pill>
              ))}
            </div>
          </div>
          <div style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)', lineHeight:1.5, marginBottom:16}}>
            提示：试试输入「打卡动机」——相似度 &gt;0.92 时将触发合并弹窗而非另建新卡（E10）
          </div>
          <div style={{display:'flex', justifyContent:'flex-end', gap:8}}>
            <Btn onClick={()=>setAddOpen(false)}>取消</Btn>
            <Btn kind="brand" onClick={submitAdd} disabled={!draft.name.trim() || !draft.desc.trim()}>生成卡片</Btn>
          </div>
        </Modal>
      )}
      {/* 相似卡片合并弹窗（>0.92 触发 · E10） */}
      {mergeOld && (
        <Modal title="相似卡片合并" onClose={()=>setMergeOld(null)} width={470}>
          <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:12}}>
            <Tag v="warning">相似度 {mergeOld.sim.toFixed(2)}</Tag>
            <span style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-tertiary)'}}>&gt; 0.92 阈值</span>
          </div>
          <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)', lineHeight:1.6, marginBottom:12}}>
            新概念与已有卡片高度相似，按知识层规则将<b style={{color:'var(--text-default)'}}>合并而非另建</b>——没有去重的知识库三个月后就是垃圾场。
          </div>
          {[['原卡', mergeOld.card, 'info'], ['新卡', {name:draft.name.trim(), desc:draft.desc.trim(),
            src:'手动 · 记下来', scope:draft.scope}, 'success']].map(([label, c, v])=>(
            <div key={label} style={{border:'1px solid var(--border-neutral-l1)', borderRadius:'var(--radius-8)',
              padding:'10px 12px', marginBottom:8, background:'var(--bg-base-secondary)'}}>
              <div style={{display:'flex', alignItems:'center', gap:7, marginBottom:3, flexWrap:'wrap'}}>
                <Tag v={v}>{label}</Tag>
                <span style={{fontSize:'var(--body-md-font-size)', fontWeight:600, color:'var(--text-default)'}}>{c.name}</span>
                <Tag c={SCOPE_META[c.scope].c} bg={SCOPE_META[c.scope].sf}>{SCOPE_META[c.scope].label}</Tag>
              </div>
              <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-secondary)', lineHeight:1.5}}>{c.desc}</div>
              <div style={{fontSize:'var(--body-xs-font-size)', color:'var(--text-tertiary)', marginTop:4}}>出处 {c.src}</div>
            </div>
          ))}
          <div style={{fontSize:'var(--body-sm-font-size)', color:'var(--text-tertiary)', marginBottom:14}}>
            合并规则：保留原卡概念名 · 复述取新卡 · 出处并存 · 关联卡片自动串接
          </div>
          <div style={{display:'flex', justifyContent:'flex-end', gap:8}}>
            <Btn onClick={()=>setMergeOld(null)}>取消</Btn>
            <Btn onClick={()=>{doAdd(); setMergeOld(null);}}>仍要另建</Btn>
            <Btn kind="brand" onClick={doMerge}>合并到原卡</Btn>
          </div>
        </Modal>
      )}
      {/* 操作反馈 */}
      {toast && (
        <div className="fadein" role="status" style={{position:'absolute', bottom:22, left:'50%',
          transform:'translateX(-50%)', background:'var(--bg-base-default)',
          border:'1px solid var(--border-neutral-l2)', borderRadius:8, padding:'8px 16px',
          fontSize:'var(--body-sm-font-size)', color:'var(--text-default)',
          boxShadow:'0 12px 32px color-mix(in srgb, var(--text-default) 16%, transparent)',
          whiteSpace:'nowrap', zIndex:80}}>
          {toast}
        </div>
      )}
    </div>
  );
}

/* ================= 应用外壳 ================= */
function App() {
  const [view, setView] = React.useState('home');            // home | chat | skills | knowledge | decisions
  const [skills, setSkills] = React.useState(SKILLS);         // 技能库（可增删/启停）
  const [cards, setCards] = React.useState(CARDS);             // 知识库（可增删/标失效/合并）
  const [curTask, setCurTask] = React.useState({key:'fitness', version:'v1.1', sid:'fit-run'});
  const [rightOpen, setRightOpen] = React.useState(true);
  const [rightTab, setRightTab] = React.useState('files');   // files | ctx
  const [artView, setArtView] = React.useState('tree');       // tree | stage | handoff（产物 Tab 二级视图）
  const [selectedFile, setSelectedFile] = React.useState('prd-v2.md');
  const [input, setInput] = React.useState('');
  // 只读 = 查看非当前版本的历史封版；「默认无版本号」（unversioned/）可正常对话
  const curProj = PROJECTS[curTask.key] || PROJECTS.fitness;
  const readOnly = view==='chat' && curTask.version!=='默认无版本号' && curTask.version!==curProj.versions[0];

  const start = () => {
    setView('chat'); setCurTask({key:'fitness', version:'v1.1', sid:'fit-run'});
    setRightOpen(true); setRightTab('files'); setArtView('tree'); setSelectedFile('prd-v2.md');
  };

  // 切项目时重置产物面板选中
  React.useEffect(()=>{
    setSelectedFile(curTask.key==='widget' ? 'clarification.md' : 'prd-v2.md');
  }, [curTask.key]);

  React.useEffect(()=>{
    const fit = ()=>{
      const s = Math.min(window.innerWidth/1480, window.innerHeight/920, 1);
      document.getElementById('stage').style.transform = 'scale('+s+')';
    };
    fit(); window.addEventListener('resize', fit);
    return ()=>window.removeEventListener('resize', fit);
  },[]);

  return (
    <div id="stage" style={{width:1480, height:920}}>
      <div style={{width:'100%', height:'100%', background:'var(--bg-base-default)',
        borderRadius:'var(--radius-12)', overflow:'hidden', border:'1px solid var(--border-neutral-l1)',
        boxShadow:'0 24px 64px color-mix(in srgb, var(--text-default) 14%, transparent), 0 4px 16px color-mix(in srgb, var(--text-default) 8%, transparent)',
        display:'flex', flexDirection:'column'}}>
        {/* 标题栏（中性窗口控制点 · token 化） */}
        <div style={{height:38, flexShrink:0, background:'var(--bg-base-secondary)',
          borderBottom:'1px solid var(--border-neutral-l1)',
          display:'flex', alignItems:'center', padding:'0 13px', position:'relative'}}>
          <div style={{display:'flex', gap:8}}>
            <span style={{width:12,height:12,borderRadius:'50%',background:'var(--bg-overlay-l3)'}}/>
            <span style={{width:12,height:12,borderRadius:'50%',background:'var(--bg-overlay-l3)'}}/>
            <span style={{width:12,height:12,borderRadius:'50%',background:'var(--bg-overlay-l3)'}}/>
          </div>
          <div style={{position:'absolute', left:0, right:0, textAlign:'center',
            fontSize:'var(--body-md-font-size)', fontWeight:600, color:'var(--text-secondary)', pointerEvents:'none'}}>
            PM Copilot — {view==='chat' ? (PROJECTS[curTask.key]||PROJECTS.fitness).name
              : view==='skills' ? '技能库'
              : view==='knowledge' ? '知识库' : '新任务'}
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:8, alignItems:'center'}}>
            <span style={{display:'flex', gap:10, alignItems:'center', color:'var(--icon-tertiary)'}}>
              {I('Search',13)}{I('Expand',13)}
            </span>
            {/* 产物与上下文 · 单一入口（最右上角）：点击展开/收起右侧面板，面板内再切换 Tab */}
            {view==='chat' && (
              <span onClick={()=>setRightOpen(!rightOpen)} role="button" tabIndex={0}
                aria-label={rightOpen?'收起产物与上下文面板':'展开产物与上下文面板'}
                title={rightOpen?'收起产物与上下文面板':'展开产物与上下文面板'}
                onKeyDown={e=>{ if(e.key==='Enter') setRightOpen(!rightOpen); }}
                style={{display:'flex', alignItems:'center', gap:5, fontSize:'var(--body-sm-font-size)',
                  color: rightOpen?'var(--text-default)':'var(--text-secondary)',
                  background: rightOpen?'var(--bg-overlay-l2)':'var(--bg-base-default)',
                  border:'1px solid '+(rightOpen?'var(--border-neutral-l2)':'var(--border-neutral-l1)'),
                  borderRadius:6, padding:'3px 10px', cursor:'pointer', flexShrink:0,
                  transition:'background .12s ease, color .12s ease'}}>
                {I('Panel-right',12,{color:'currentColor'})}产物与上下文
              </span>
            )}
          </div>
        </div>
        {/* 只读提示条（warning 语义 surface） */}
        {readOnly && view==='chat' && (
          <div className="fadein" role="status" style={{background:'var(--status-warning-surface-l1)',
            borderBottom:'1px solid var(--status-warning-surface-l2)', padding:'5px 16px',
            fontSize:'var(--body-sm-font-size)', color:'var(--status-warning-default)',
            display:'flex', alignItems:'center', gap:8}}>
            {I('Lock',12)}正在查看已封版 {curTask.version} · 全界面只读 · 与封版快照逐字一致（E13）
          </div>
        )}
        {/* 主体 */}
        <div style={{flex:1, minHeight:0, display:'flex'}}>
          <Sidebar view={view} curTask={curTask} setCurTask={setCurTask} setView={setView}
            skillCount={skills.length} cardCount={cards.length}/>
          {view==='home'
            ? <Home onStart={start} input={input} setInput={setInput}/>
            : view==='skills'
            ? <SkillLibrary skills={skills} setSkills={setSkills}/>
            : view==='knowledge'
            ? <KnowledgeLibrary cards={cards} setCards={setCards}/>
            : view==='decisions'
            ? <DecisionLogPage/>
            : <ChatPanel curTask={curTask} setVersion={v=>setCurTask({...curTask, version:v})}
                readOnly={readOnly} goHome={()=>setView('home')}
                openPanel={(tab)=>{ setRightTab(tab); setRightOpen(true); }}
                onOpenFile={(f)=>{ setSelectedFile(f); setRightTab('files'); setArtView('tree'); setRightOpen(true); }}/>}
          {view==='chat' && rightOpen &&
            <RightPanel pKey={FILES[curTask.key]?curTask.key:'fitness'} tab={rightTab} setTab={setRightTab}
              onClose={()=>setRightOpen(false)} selectedFile={selectedFile} onSelectFile={setSelectedFile}
              artView={artView} setArtView={setArtView}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
