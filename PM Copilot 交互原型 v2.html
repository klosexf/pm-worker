  设计假设（说明给用户）：
  1. 界面范式参照 TRAE Work：左=项目/版本树，中=Agent 对话流（核心工作区），右=待办/产物/上下文 三面板

     Messages 式气泡、Segmented Control、0.5px 分隔线——只用系统原生控件（design.md §9 UI 决策 2）
  3. 核心叙事 = design.md §3 原则 1「Agent 的核心是 Agent Loop，不是对话框」：
     一句话输入 → 计划卡(五阶段) → ①澄清对话(含记忆覆盖提示) → 一键流水线 ②③④⑤ → 打回→修订→复审通过 → 封板
  4. 可点路径：左栏切项目(切 scope E12) / 版本切 v1.0 只读黄条(E13/E14) / 右栏三 tab /
     调研工具行展开看出处(E4) / 产物文件树(§5.1 真实目录) / 上下文 tab(token构成+trace+skill 1/30, E11/E12)
  5. 示例数据全部来自 design.md「我的健身App」案例，不编造
-->

/* ================= 小组件 ================= */

function Ic({s, size=13}) { return <span style={{fontSize:size, lineHeight:1}}>{s}</span>; }

function Tag({children, c=T.sub, bg='rgba(0,0,0,0.05)', mono}) {
  return <span style={{fontSize:9.5, color:c, background:bg, borderRadius:4, padding:'1.5px 6px', fontFamily:mono?F.mono:undefined, whiteSpace:'nowrap', fontWeight:500}}>{children}</span>;
}

function Btn({children, onClick, kind='plain', disabled, small}) {
  const base = {fontSize:11.5, padding:small?'3px 10px':'5px 14px', borderRadius:6, cursor:disabled?'default':'pointer',
    fontWeight:500, transition:'all .12s', border:'0.5px solid '+T.line, background:'#fff', color:T.ink, whiteSpace:'nowrap'};
  if (kind==='primary') { base.background=T.blue; base.color='#fff'; base.border='0.5px solid '+T.blue; }
  if (kind==='danger')  { base.background='#fff'; base.color=T.red; base.border='0.5px solid rgba(229,72,77,0.4)'; }
  if (kind==='ghost')   { base.border='0.5px solid transparent'; base.background='transparent'; base.color=T.sub; }
  if (disabled)         { base.opacity=0.4; }
  return <button style={base} onClick={disabled?undefined:onClick}>{children}</button>;
}

        </div>
      </div>
      <div style={{flex:1, overflowY:'auto', padding:'4px 14px 14px'}} className="fadein" key={tab}>
        {tab==='todo' && <TodoPanel todos={todos}/>}
        {tab==='files' && <FilePanel tree={FILES[pKey]}/>}
        {tab==='ctx' && <CtxPanel ctx={p.ctx}/>}
      </div>
    </div>
  );
}

/* --- 待办面板：流水线 checklist --- */
function TodoPanel({todos}) {
  return (
    <div>
      <div style={{fontSize:10.5, color:T.sub, marginBottom:9, display:'flex', alignItems:'center', gap:5}}>
        <Ic s="🧭" size={11}/> 运行态持久化 · 中断后可恢复（E8）
      </div>
      {todos.map(item=>{
        const m = STAGE_META[item.s] || {n:'📦', color:T.sub};
        return (
          <div key={item.s} style={{marginBottom:8, borderRadius:9, padding:'8px 10px',
            background: item.run ? 'rgba(142,90,216,0.07)' : 'rgba(255,255,255,0.9)',
            border:'0.5px solid ' + (item.run ? 'rgba(142,90,216,0.25)' : T.lineSoft)}}>
            <div style={{display:'flex', alignItems:'center', gap:7}}>
              <span style={{fontSize:11, fontWeight:700, color:m.color, width:14}}>{m.n}</span>
              <span style={{fontSize:12, fontWeight:600, color:T.ink}}>{item.label}</span>
              <span style={{marginLeft:'auto', fontSize:12, color:item.done?T.green:(item.run?T.purple:T.faint)}}>
                {item.done?'✓':(item.run?'●':'○')}
              </span>
            </div>
            {item.sub.filter(Boolean).map((s,i)=>(
              <div key={i} style={{marginLeft:21, marginTop:3, fontSize:10.5, color: item.warn&&i===0?T.amber:T.sub,
                display:'flex', gap:4, alignItems:'center'}}>
                <span style={{color:item.warn&&i===0?T.amber:T.faint, fontSize:9}}>{item.warn&&i===0?'↺':'·'}</span>{s}
              </div>
            ))}
            {item.run && <div style={{marginLeft:21, marginTop:5, height:3, borderRadius:2, background:'rgba(0,0,0,0.06)', overflow:'hidden'}}>
              <div style={{width:'40%', height:'100%', background:T.purple}}/>
            </div>}
          </div>
        );
      })}
    </div>
  );
}

/* --- 产物面板：文件树（§5.1 真实目录，唯一事实源） --- */
function FileNode({node, depth}) {
  const [open, setOpen] = React.useState(node.open!==false);
  if (node.f) return (
    <div style={{display:'flex', alignItems:'center', gap:6, padding:'2.5px 4px', fontSize:11, cursor:'pointer',
      borderRadius:4, color:T.ink}} className="file-row"
      onMouseEnter={e=>e.currentTarget.style.background='rgba(0,0,0,0.04)'}
      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
      <Ic s="📄" size={10}/>
      <span style={{fontFamily:F.mono, fontSize:10.5, fontWeight:node.star?600:400}}>{node.f}</span>
      {node.badge && <Tag c={T.blue} bg={T.blueBg} mono>{node.badge}</Tag>}
      {node.old && <Tag c={T.faint} mono>旧</Tag>}
      <span style={{fontSize:9, color:T.faint, marginLeft:'auto', whiteSpace:'nowrap', overflow:'hidden',
        textOverflow:'ellipsis', maxWidth:90}}>{node.meta}</span>
    </div>
  );
  return (
    <div>
      <div onClick={()=>setOpen(!open)} style={{display:'flex', alignItems:'center', gap:5, padding:'2.5px 4px',
        fontSize:11, cursor:'pointer', borderRadius:4, fontWeight:600}} className="dir-row"
        onMouseEnter={e=>e.currentTarget.style.background='rgba(0,0,0,0.04)'}
        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
        <span style={{fontSize:8, color:T.faint, transition:'transform .15s', display:'inline-block',
          transform:open?'rotate(90deg)':'none'}}>▶</span>
        <Ic s="📁" size={11}/>
        <span style={{fontFamily:F.mono, fontSize:10.5}}>{node.dir}</span>
      </div>
      {open && node.children.map((c,i)=>(
        <div key={i} style={{marginLeft:13, borderLeft:'1px solid '+T.lineSoft, paddingLeft:7}}>
          <FileNode node={c} depth={depth+1}/>
        </div>
      ))}
    </div>
  );
}
function FilePanel({tree}) {
  return (
    <div>
      <div style={{fontSize:10.5, color:T.sub, marginBottom:9, display:'flex', alignItems:'center', gap:5}}>
        <Ic s="🗄" size={11}/> 文件是唯一事实源 · 索引可丢弃重建
      </div>
      {tree.map((n,i)=><FileNode key={i} node={n} depth={0}/>)}
      <div style={{marginTop:12, display:'flex', gap:7}}>
        <Btn small>在 Finder 中打开</Btn>
        <Btn small kind="ghost">重建索引</Btn>
      </div>
    </div>
  );
}

/* --- 上下文面板：检查器 ★★（E11/E12 可观测证明） --- */
function CtxPanel({ctx}) {
  const [missOpen, setMissOpen] = React.useState(false);
  const used = ctx.tokens.reduce((a,t)=>a+t.v,0);
  return (
    <div>
      {/* token 构成 */}
      <PanelTitle>Token 构成 · {used.toFixed(1)}k / {ctx.total}k</PanelTitle>
      <div style={{display:'flex', height:13, borderRadius:4, overflow:'hidden', marginBottom:7, border:'0.5px solid '+T.lineSoft}}>
        {ctx.tokens.map(t=><div key={t.k} style={{width:(t.v/ctx.total*100)+'%', background:t.c}}/>)}
      </div>
      <div style={{display:'flex', flexWrap:'wrap', gap:'3px 10px', marginBottom:13}}>
        {ctx.tokens.map(t=>(
          <span key={t.k} style={{fontSize:10, color:T.sub, display:'flex', alignItems:'center', gap:4}}>
            <span style={{width:7, height:7, borderRadius:2, background:t.c}}/>{t.k} {t.v}k
          </span>
        ))}
      </div>
      {/* 检索 trace */}
      <PanelTitle>检索 Trace · scope 强制过滤</PanelTitle>
      <div style={{fontSize:10, fontFamily:F.mono, color:T.sub, marginBottom:6}}>query: {ctx.query}</div>
      {ctx.hits.map(h=>(
        <div key={h.id} style={{display:'flex', alignItems:'center', gap:6, padding:'4px 7px', borderRadius:6,
          background:'rgba(255,255,255,0.9)', border:'0.5px solid '+T.lineSoft, marginBottom:4}}>
          <span style={{fontFamily:F.mono, fontSize:9.5, color:T.blue}}>{h.id}</span>
          <span style={{fontSize:10.5, color:T.ink, flex:1, overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis'}}>{h.name}</span>
          <span style={{fontFamily:F.mono, fontSize:9.5, color:T.green}}>{h.sim}</span>
          <Tag c={h.scope==='全局'?T.gray:T.blue} bg={h.scope==='全局'?'rgba(0,0,0,0.05)':T.blueBg}>{h.scope}</Tag>
        </div>
      ))}
      <div style={{fontSize:10, color:T.faint, margin:'4px 0 13px'}}>{ctx.filtered}</div>
      {/* skill 注入 */}
      <PanelTitle>Skill 注入 · 1/30</PanelTitle>
      <div style={{padding:'6px 9px', borderRadius:7, background:'rgba(142,90,216,0.07)', border:'0.5px solid rgba(142,90,216,0.2)', marginBottom:5}}>
        <div style={{fontSize:11.5, fontWeight:600, color:T.purple}}>✓ {ctx.skillHit}</div>
        <div style={{fontSize:10, color:T.sub}}>{ctx.skillBody}</div>
      </div>
      <div onClick={()=>setMissOpen(!missOpen)} style={{fontSize:10.5, color:T.sub, cursor:'pointer', display:'flex', alignItems:'center', gap:5, marginBottom:13}}>
        <span style={{fontSize:8, transition:'transform .15s', display:'inline-block', transform:missOpen?'rotate(90deg)':'none'}}>▶</span>
        展开未命中 29 条（证明正文未被注入 · E11）
      </div>
      {missOpen && (
        <div className="fadein" style={{fontSize:10, color:T.faint, fontFamily:F.mono, lineHeight:1.8,
          padding:'6px 9px', borderRadius:6, background:'rgba(0,0,0,0.03)', marginBottom:13}}>
          KANO 模型 · RICE 排序 · 用户故事地图 · 漏项雷达 …<br/>
          <span style={{color:T.sub}}>仅元数据常驻，正文 0 token</span>
        </div>
      )}
      {/* 记忆注入 */}
      <PanelTitle>记忆注入 · 覆盖而非并存</PanelTitle>
      {ctx.memories.map((m,i)=>(
        <div key={i} style={{display:'flex', gap:6, alignItems:'flex-start', padding:'4px 7px', marginBottom:3,
          borderRadius:6, background:'rgba(255,255,255,0.9)', border:'0.5px solid '+T.lineSoft, opacity:m.dead?0.5:1}}>
          <Tag c={m.kind==='否决项'?T.red:(m.kind==='约束'?T.blue:T.gray)}
               bg={m.kind==='否决项'?'rgba(229,72,77,0.08)':(m.kind==='约束'?T.blueBg:'rgba(0,0,0,0.05)')}>{m.kind}</Tag>
          <div style={{flex:1, fontSize:10.5, color:T.ink, textDecoration:m.dead?'line-through':'none', lineHeight:1.5}}>
            {m.t}
            {m.dead && <div style={{fontSize:9.5, color:T.blue, textDecoration:'none', marginTop:1}}>↳ 被 {m.by} 覆盖 · 未注入</div>}
          </div>
          <Tag mono>{m.s}</Tag>
        </div>
      ))}
      {/* write-then-verify */}
      <PanelTitle>落盘校验 · write-then-verify</PanelTitle>
      {ctx.verify.map(v=>(
        <div key={v.f} style={{fontSize:10.5, fontFamily:F.mono, color:T.green, padding:'2px 0'}}>
          ✓ {v.f} · 回读一致
        </div>
      ))}
    </div>
  );
}
function PanelTitle({children}) {
  return <div style={{fontSize:10.5, fontWeight:700, color:T.ink, marginBottom:6, marginTop:2}}>{children}</div>;
}

/* ================= 应用外壳 ================= */
function App() {
  const [project, setProject] = React.useState('fitness');
  const [version, setVersion] = React.useState('v1.1');
  const [tab, setTab] = React.useState('todo');
  const p = PROJECTS[project];
  const readOnly = version!==p.versions[0];
  const goCtx = ()=>setTab('ctx');

  React.useEffect(()=>{
    const fit = ()=>{
      const s = Math.min(window.innerWidth/1480, window.innerHeight/920, 1);
      document.getElementById('stage').style.transform = 'scale('+s+')';
    };
    fit(); window.addEventListener('resize', fit);
    return ()=>window.removeEventListener('resize', fit);
  },[]);

  return (
    <div id="stage" style={{width:1480, height:920}}>
      <div style={{width:'100%', height:'100%', background:'#fff', borderRadius:11, overflow:'hidden',
        boxShadow:'0 50px 120px rgba(0,0,0,0.55), 0 0 0 0.5px rgba(255,255,255,0.12)',
        display:'flex', flexDirection:'column'}}>
        {/* 标题栏：traffic lights + 居中标题 */}
        <div style={{height:40, flexShrink:0, background:'rgba(246,246,248,0.9)', backdropFilter:'blur(20px)',
          borderBottom:'0.5px solid '+T.line, display:'flex', alignItems:'center', padding:'0 14px', position:'relative'}}>
          <div style={{display:'flex', gap:8}}>
            <span style={{width:12,height:12,borderRadius:'50%',background:'#ff5f57',border:'0.5px solid rgba(0,0,0,0.12)'}}/>
            <span style={{width:12,height:12,borderRadius:'50%',background:'#febc2e',border:'0.5px solid rgba(0,0,0,0.12)'}}/>
            <span style={{width:12,height:12,borderRadius:'50%',background:'#28c840',border:'0.5px solid rgba(0,0,0,0.12)'}}/>
          </div>
          <div style={{position:'absolute', left:0, right:0, textAlign:'center', fontSize:13, fontWeight:600, color:'#3a3a3c', pointerEvents:'none'}}>
            PM Copilot — {p.name}
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:9, alignItems:'center', fontSize:11, color:T.sub}}>
            <span style={{fontFamily:F.mono, fontSize:10.5}}>本月 ¥4.2 · 3.1M tokens</span>
            <Ic s="⚙️" size={14}/>
          </div>
        </div>
        {/* 只读黄条 */}
        {readOnly && (
          <div className="fadein" style={{background:'rgba(217,119,6,0.10)', borderBottom:'0.5px solid rgba(217,119,6,0.25)',
            padding:'5px 16px', fontSize:11.5, color:'#8a5a08', display:'flex', alignItems:'center', gap:8}}>
            🔒 正在查看已封版 {version} · 全界面只读 · 与封版快照逐字一致（E13）· 决策日志保留全部推翻记录
          </div>
        )}
        {/* 三栏主体 */}
        <div style={{flex:1, minHeight:0, display:'flex'}}>
          <Sidebar pKey={project} setProject={setProject} version={version} setVersion={setVersion}/>
          <ChatPanel pKey={project} version={version} setVersion={setVersion} readOnly={readOnly} goCtx={goCtx}/>
          <RightPanel pKey={project} tab={tab} setTab={setTab}/>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
