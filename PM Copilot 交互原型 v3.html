const EXTRA_SESSIONS = [];   // 运行时「新建会话」落点：{pKey, ver, session}
let _sidSeq = 0;
function findSession(sid){
  const ex = EXTRA_SESSIONS.find(e=>e.session.id===sid);
  if (ex) return ex.session;
  for (const p of ALL_TREES) for (const vn of (p.versions||[])) for (const s of (vn.sessions||[]))
    if (s.id===sid) return s;
  return null;
}
/* 某项目/版本下的会话列表 = 预置 + 运行时新建（原型演示） */

/* ================= 基础组件 ================= */

function Tag({children, c=T.sub, bg='rgba(255,255,255,0.06)', mono}) {
  return <span style={{fontSize:9.5, color:c, background:bg, borderRadius:4, padding:'1.5px 6px',
    fontFamily:mono?F.mono:undefined, whiteSpace:'nowrap', fontWeight:500}}>{children}</span>;
}

function Btn({children, onClick, kind='plain', disabled, small}) {
  const base = {fontSize:11.5, padding:small?'3px 10px':'5px 14px', borderRadius:7, cursor:disabled?'default':'pointer',
    fontWeight:500, transition:'all .12s', border:'0.5px solid '+T.lineHi, background:T.cardHi, color:T.ink, whiteSpace:'nowrap'};
  if (kind==='primary') { base.background=T.purpleD; base.color='#fff'; base.borderColor='transparent'; }
  if (kind==='danger')  { base.color=T.red; base.borderColor='rgba(248,113,113,0.35)'; }
  if (kind==='ghost')   { base.borderColor='transparent'; base.background='transparent'; base.color=T.sub; }
  if (disabled) base.opacity=0.35;
  return <button style={base} onClick={disabled?undefined:onClick}>{children}</button>;
}

function Avatar({stage, size=24}) {
  const m = STAGES[stage];
  return (
    <div style={{width:size, height:size, borderRadius:'50%', background:m.c+'1F', color:m.c,
      display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, flexShrink:0}}>
      {m.n}
    </div>
  );
}

/* ---- 第三层：会话行（每个节点 = 一个会话窗口，点击打开） ---- */
function SessionRow({s, curTask, view, onPick}) {
  const active = view==='chat' && curTask && curTask.sid===s.id;
  return (
    <div onClick={onPick} title={s.title+' · 点击打开会话窗口'}
      style={{display:'flex', alignItems:'center', gap:7, padding:'3px 8px 3px 34px',
        fontSize:11.5, color:s.st==='done'?T.sub:T.faint, cursor:'pointer', borderRadius:6,
        background:active?'rgba(139,92,246,0.14)':'transparent'}}
      onMouseEnter={e=>{ if(!active) e.currentTarget.style.background='rgba(255,255,255,0.04)'; }}
      onMouseLeave={e=>{ if(!active) e.currentTarget.style.background='transparent'; }}>
      <span style={{fontSize:10, color:s.st==='done'?T.green:(s.st==='run'?T.purple:T.faint),
        flexShrink:0}}>{s.st==='done'?'●':(s.st==='run'?'◐':'○')}</span>
      <span style={{overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis',
        color:active?T.ink:undefined, fontWeight:active?600:400}}>{s.title}</span>
      {s.st==='run' && <span className="run-dot" style={{width:5, height:5, borderRadius:'50%', background:T.purple, flexShrink:0}}/>}
      <span style={{fontSize:9, color:T.faint, marginLeft:'auto', flexShrink:0}}>{s.time}</span>
    </div>
  );
}

/* ================= 右侧面板：产物 / 上下文 双 Tab ================= */

      </div>
      {/* 产物 Tab 二级视图：文件树（§5.1）/ 按阶段（§4）/ 交接（§7） */}
      {tab==='files' && (
        <div style={{display:'flex', gap:2, padding:'0 12px 8px'}}>
          {[['tree','文件'],['stage','按阶段'],['handoff','交接']].map(([k,label])=>(

              style={{flex:1, textAlign:'center', fontSize:10, fontWeight:artView===k?600:400, padding:'3px 0', borderRadius:6,
                cursor:'pointer', color:artView===k?T.purple:T.faint,
                background:artView===k?'rgba(139,92,246,0.13)':'transparent',
                boxShadow:artView===k?'inset 0 0 0 1px rgba(139,92,246,0.35)':'none'}}>
              {label}

        ? (artView==='tree'

/* ---- 产物面板：VS Code 资源管理器风格 ---- */

/* 文件类型图标（VS Code 式着色：md 蓝 / html 橙 / json 黄） */
function FileIco({type}) {
  const map = {
    md:   {g:'M',   c:T.blue,   bg:'rgba(94,168,255,0.16)', fs:9},
    html: {g:'</>', c:'#FB923C', bg:'rgba(251,146,60,0.16)', fs:6.5, mono:true},
    json: {g:'{}',  c:T.amber,  bg:'rgba(251,191,36,0.16)', fs:8, mono:true},
  };
  const m = map[type] || {g:'·', c:T.faint, bg:'transparent', fs:9};
  return (
    <span style={{width:15, height:15, borderRadius:3.5, background:m.bg, color:m.c, fontSize:m.fs,
      fontWeight:700, display:'inline-flex', alignItems:'center', justifyContent:'center', flexShrink:0,
      fontFamily:m.mono?F.mono:undefined}}>{m.g}</span>
  );
}

/* 目录节点（可折叠） */
function DirNode({node, depth, render}) {
  const [open, setOpen] = React.useState(node.open!==false);
  return (
    <div>
      <div onClick={()=>setOpen(!open)} style={{display:'flex', alignItems:'center', gap:5, padding:'3px 6px',
        borderRadius:5, cursor:'pointer', paddingLeft:6+depth*13}}
        onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.04)'}
        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
        <span style={{fontSize:7.5, color:T.faint, display:'inline-block', width:8,
          transform:open?'rotate(90deg)':'none', transition:'transform .15s'}}>▶</span>
        <span style={{fontSize:11}}>📁</span>
        <span style={{fontFamily:F.mono, fontSize:10.5, fontWeight:600, color:T.sub}}>{node.dir}</span>
      </div>
      {open && node.children.map(c=>render(c, depth+1))}
    </div>
  );
}

function FilesPanel({pKey, selectedFile, onSelectFile}) {
  const tree = FILES[pKey].tree;
  const [outlineOpen, setOutlineOpen] = React.useState(true);
  const [timelineOpen, setTimelineOpen] = React.useState(false);
  const outline = OUTLINES[selectedFile] || null;

  const renderNode = (node, depth) => {
    if (node.f) {
      const sel = node.f===selectedFile;
      return (
        <div key={node.f} onClick={()=>onSelectFile(node.f)} title={node.meta}
          style={{display:'flex', alignItems:'center', gap:6, padding:'3px 6px', borderRadius:5, cursor:'pointer',
            background:sel?'rgba(139,92,246,0.15)':'transparent', paddingLeft:6+depth*13}}
          onMouseEnter={e=>{if(!sel)e.currentTarget.style.background='rgba(255,255,255,0.04)';}}
          onMouseLeave={e=>{if(!sel)e.currentTarget.style.background='transparent';}}>
          <FileIco type={node.type}/>
          <span style={{fontFamily:F.mono, fontSize:10.5, color:sel?T.ink:T.sub,
            fontWeight:node.star||sel?600:400}}>{node.f}</span>
          {node.star && <span style={{fontSize:8, color:T.amber}}>★</span>}
          {node.old && <Tag c={T.faint}>旧</Tag>}
          {node.badge && <Tag c={T.blue} bg='rgba(94,168,255,0.12)' mono>{node.badge}</Tag>}
        </div>
      );
    }
    return <DirNode key={node.dir} node={node} depth={depth} render={renderNode}/>;
  };

  return (
    <div style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column'}}>
      {/* 工具条（仿参考图顶部图标行） */}
      <div style={{display:'flex', alignItems:'center', gap:2, padding:'2px 10px 6px'}}>
        {['⟳','⇤','🔍','⊕'].map(ic=>(
          <span key={ic} style={{width:22, height:22, borderRadius:5, display:'flex', alignItems:'center',
            justifyContent:'center', fontSize:11, color:T.faint, cursor:'pointer'}}
            onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,0.06)'; e.currentTarget.style.color=T.sub;}}
            onMouseLeave={e=>{e.currentTarget.style.background='transparent'; e.currentTarget.style.color=T.faint;}}>{ic}</span>
        ))}
        <span style={{fontSize:10, color:T.faint, marginLeft:'auto'}}>文件是唯一事实源</span>
      </div>
      {/* 文件树 */}
      <div style={{padding:'0 6px'}}>
        {tree.map((n,i)=>renderNode(n, 0))}
      </div>
      {/* 选中文件 meta */}
      {selectedFile && (
        <div style={{margin:'8px 12px 0', padding:'6px 9px', borderRadius:6, background:'rgba(255,255,255,0.03)',
          border:'0.5px solid '+T.line, display:'flex', alignItems:'center', gap:6}}>
          <FileIco type={selectedFile.split('.').pop()==='html'?'html':(selectedFile.includes('.json')?'json':'md')}/>
          <span style={{fontFamily:F.mono, fontSize:10, color:T.sub}}>{selectedFile}</span>
        </div>
      )}
      <div style={{flex:1}}/>
      {/* 大纲（仿 VS Code Outline） */}
      <div style={{borderTop:'0.5px solid '+T.line, margin:'8px 8px 0'}}>
        <div onClick={()=>setOutlineOpen(!outlineOpen)} style={{display:'flex', alignItems:'center', gap:5,
          padding:'6px 6px', cursor:'pointer', fontSize:11, fontWeight:700, color:T.sub}}>
          <span style={{fontSize:7.5, color:T.faint, display:'inline-block', width:8,
            transform:outlineOpen?'rotate(90deg)':'none', transition:'transform .15s'}}>▶</span>
          大纲
          <span style={{marginLeft:'auto', fontSize:9.5, fontWeight:400, color:T.faint}}>
            {outline ? outline.length+' 节' : '选择文件查看'}
          </span>
        </div>
        {outlineOpen && (outline
          ? <div style={{padding:'0 6px 6px'}}>
              {outline.map((s,i)=>(
                <div key={i} style={{display:'flex', alignItems:'center', gap:6, padding:'2.5px 5px 2.5px 19px',
                  fontSize:10.5, color:s.includes('⚠️')?T.amber:T.sub, cursor:'pointer', borderRadius:4}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.04)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span style={{fontSize:8, color:T.faint}}>{s.includes('⚠️')?'⚠':'·'}</span>{s.replace(' ⚠️','')}
                </div>
              ))}
            </div>
          : <div style={{padding:'0 6px 8px 19px', fontSize:10, color:T.faint}}>无大纲（非文档类型或未选择）</div>
        )}
      </div>
      {/* 时间线（仿 VS Code Timeline · 快照历史） */}
      <div style={{borderTop:'0.5px solid '+T.line, margin:'0 8px 8px'}}>
        <div onClick={()=>setTimelineOpen(!timelineOpen)} style={{display:'flex', alignItems:'center', gap:5,
          padding:'6px 6px', cursor:'pointer', fontSize:11, fontWeight:700, color:T.sub}}>
          <span style={{fontSize:7.5, color:T.faint, display:'inline-block', width:8,
            transform:timelineOpen?'rotate(90deg)':'none', transition:'transform .15s'}}>▶</span>
          时间线
          <span style={{marginLeft:'auto', fontSize:9.5, fontWeight:400, color:T.faint}}>{TIMELINES[pKey].length}</span>
        </div>
        {timelineOpen && (
          <div style={{padding:'0 6px 6px'}}>
            {TIMELINES[pKey].map((e,i)=>(
              <div key={i} style={{display:'flex', alignItems:'center', gap:7, padding:'3px 5px 3px 19px',
                fontSize:10, borderRadius:4, cursor:'pointer'}}
                onMouseEnter={e2=>e2.currentTarget.style.background='rgba(255,255,255,0.04)'}
                onMouseLeave={e2=>e2.currentTarget.style.background='transparent'}>
                <span style={{fontFamily:F.mono, fontSize:9, color:e.tag?T.amber:T.purple}}>{e.h}</span>
                <span style={{color:T.sub, flex:1, overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis'}}>{e.m}</span>
                <span style={{fontSize:9, color:T.faint, fontFamily:F.mono}}>{e.t}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      {/* 底部操作 */}
      <div style={{padding:'0 12px 12px', display:'flex', gap:7}}>
        <Btn small>在 Finder 中打开</Btn>
        <Btn small kind="ghost">重建索引</Btn>
      </div>
    </div>
  );
}

/* ---- 产物面板 · 视图二：按阶段（design.md §4：阶段完成 = 产物落盘 + 纪要 + 知识点抽取 + 决策写入） ---- */
function StageArtifactsPanel({pKey, onLocate}) {
  const list = STAGE_ARTIFACTS[pKey];
  const [open, setOpen] = React.useState(
    ()=>Object.fromEntries(list.map(s=>[s.s, s.files.length>0 || !!s.running])));
  return (
    <div style={{flex:1, overflowY:'auto', padding:'2px 10px 12px', display:'flex', flexDirection:'column', gap:6}}>
      <div style={{fontSize:9.5, color:T.faint, padding:'0 2px'}}>
        每阶段完成 = 产物落盘 + 纪要 + 知识点抽取 + 决策写入 · 点击文件在文件树中定位
      </div>
      {list.map(seg=>{
        const st = STAGES[seg.s];
        const isOpen = open[seg.s];
        const ftype = f => f.endsWith('.html')?'html':(f.includes('.json')?'json':'md');
        return (
          <div key={seg.s} style={{borderRadius:8, border:'0.5px solid '+T.line,
            background:'rgba(255,255,255,0.02)', overflow:'hidden',
            opacity:(!seg.files.length && !seg.running)?0.55:1}}>
            {/* 阶段头 */}
            <div onClick={()=>setOpen({...open, [seg.s]:!isOpen})}
              style={{display:'flex', alignItems:'center', gap:7, padding:'6px 8px', cursor:'pointer'}}
              onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.03)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <Avatar stage={seg.s} size={18}/>
              <span style={{fontSize:11.5, fontWeight:600, color:T.ink}}>{st.name}</span>
              {seg.running
                ? <Tag c={T.blue} bg='rgba(94,168,255,0.12)'>● 运行中</Tag>
                : seg.files.length
                  ? <Tag c={T.green} bg='rgba(74,222,128,0.1)'>✓ {seg.files.length} 产物</Tag>
                  : <Tag>未开始</Tag>}
              <span style={{fontSize:7.5, color:T.faint, marginLeft:'auto', display:'inline-block', width:8,
                transform:isOpen?'rotate(90deg)':'none', transition:'transform .15s'}}>▶</span>
            </div>
            {/* 阶段体 */}
            {isOpen && (
              <div className="fadein" style={{padding:'1px 8px 7px'}}>
                {seg.files.length
                  ? seg.files.map(fl=>(
                      <div key={fl.f} onClick={()=>onLocate(fl.f.split('/').pop())} title={fl.meta}
                        style={{display:'flex', alignItems:'center', gap:6, padding:'3px 5px', borderRadius:5, cursor:'pointer'}}
                        onMouseEnter={e=>e.currentTarget.style.background='rgba(139,92,246,0.1)'}
                        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                        <FileIco type={ftype(fl.f)}/>
                        <span style={{fontFamily:F.mono, fontSize:10, color:T.sub, fontWeight:fl.star?600:400,
                          textDecoration:fl.old?'line-through':'none'}}>
                          {(fl.dir||'')+fl.f}
                        </span>
                        {fl.star && <span style={{fontSize:8, color:T.amber}}>★</span>}
                        <span style={{fontSize:9, color:T.faint, marginLeft:'auto',
                          overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis', flexShrink:1}}>{fl.meta}</span>
                      </div>
                    ))
                  : <div style={{fontSize:10, color:T.faint, padding:'2px 5px 3px'}}>
                      {seg.running ? (seg.note||'阶段执行中…') : '本阶段尚未产出文件'}
                    </div>}
                {/* 阶段收尾三件事 */}
                <div style={{display:'flex', gap:4, flexWrap:'wrap', marginTop:5, paddingLeft:2}}>
                  <Tag c={seg.extract!=='—'?T.green:T.faint}
                       bg={seg.extract!=='—'?'rgba(74,222,128,0.08)':'rgba(255,255,255,0.04)'}>
                    知识 {seg.extract}
                  </Tag>
                  <Tag c={seg.decisions>0?T.amber:T.faint}
                       bg={seg.decisions>0?'rgba(251,191,36,0.08)':'rgba(255,255,255,0.04)'}>
                    决策 +{seg.decisions}
                  </Tag>
                  {seg.note && !seg.running && (
                    <Tag c={T.blue} bg='rgba(94,168,255,0.08)'>{seg.note}</Tag>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ---- 产物面板 · 视图三：交接（design.md §7：封板交接 + MCP 开放通道 + V2 导出） ---- */

      <PT>版本封板 · release-notes 自动生成</PT>
      <div style={{padding:'7px 9px', borderRadius:7, marginBottom:12,

                </div>
                <Btn small kind="primary" onClick={()=>setSealed(true)}>封板</Btn>
              </div>
            : <div style={{fontSize:11, color:T.faint}}>○ 未满足封板条件：流水线未完成 / 评审未过门禁</div>}
        {sealed && <div style={{fontSize:9.5, color:T.faint, marginTop:3}}>release-notes.md 已生成 · V1 版本目录冻结 · 新需求进 v1.1+ 继承</div>}
      </div>
      {/* release notes diff */}
      {h.release.length>0 && (
        <div style={{marginBottom:12}}>
          <PT>release-notes.md（封板时自动生成）</PT>
          <div style={{padding:'5px 8px', borderRadius:7, background:'rgba(255,255,255,0.03)',
            border:'0.5px solid '+T.line, fontFamily:F.mono}}>
            {h.release.map((r,i)=>(
              <div key={i} style={{display:'flex', gap:6, fontSize:10, padding:'2px 0',
                color:r.op==='+'?T.green:T.red}}>
                <span style={{fontWeight:700}}>{r.op}</span>
                <span style={{color:T.sub}}>{r.text}</span>

        </div>
      )}
      {/* 不可变文件 */}

        {ctx.hits.map(h=>(
          <div key={h.id} style={{display:'flex', alignItems:'center', gap:6, padding:'4px 7px', borderRadius:6,

            <span style={{fontFamily:F.mono, fontSize:9.5, color:T.blue}}>{h.id}</span>
            <span style={{fontSize:10.5, color:T.ink, flex:1, overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis'}}>{h.name}</span>
            <span style={{fontFamily:F.mono, fontSize:9.5, color:T.green}}>{h.sim}</span>
            <Tag c={h.scope==='全局'?T.faint:T.blue} bg={h.scope==='全局'?'rgba(255,255,255,0.05)':'rgba(94,168,255,0.12)'}>{h.scope}</Tag>
          </div>
        ))}
        <div style={{fontSize:10, color:T.faint, margin:'4px 0 14px'}}>{ctx.filtered}</div>
        {/* skill */}
        <PT>Skill 注入 · 1/30</PT>
        <div style={{padding:'6px 9px', borderRadius:7, background:'rgba(139,92,246,0.08)',
          border:'0.5px solid rgba(139,92,246,0.25)', marginBottom:5}}>
          <div style={{fontSize:11.5, fontWeight:600, color:T.purple}}>✓ {ctx.skill}</div>
          <div style={{fontSize:10, color:T.sub}}>正文 1.5k tokens · 仅此 1 条注入</div>
        </div>
        <div onClick={()=>setMissOpen(!missOpen)} style={{fontSize:10.5, color:T.sub, cursor:'pointer',
          display:'flex', alignItems:'center', gap:5, marginBottom:14}}>
          <span style={{fontSize:8, display:'inline-block', transition:'transform .15s',
            transform:missOpen?'rotate(90deg)':'none'}}>▶</span>
          展开未命中 29 条（证明正文未注入 · E11）
        </div>
        {missOpen && (
          <div className="fadein" style={{fontSize:10, color:T.faint, fontFamily:F.mono, lineHeight:1.8,
            padding:'6px 9px', borderRadius:6, background:'rgba(255,255,255,0.03)', marginBottom:14}}>
            KANO · RICE · 用户故事地图 · 漏项雷达 …<br/>
            <span style={{color:T.sub}}>仅元数据常驻，正文 0 token</span>
          </div>
        )}
        {/* 记忆 */}
        <PT>记忆注入 · 覆盖而非并存</PT>
        {ctx.memories.map((m,i)=>(
          <div key={i} style={{display:'flex', gap:6, alignItems:'flex-start', padding:'4px 7px', marginBottom:3,
            borderRadius:6, background:'rgba(255,255,255,0.03)', border:'0.5px solid '+T.line, opacity:m.dead?0.45:1}}>
            <Tag c={m.kind==='否决项'?T.red:(m.kind==='约束'?T.blue:T.faint)}
                 bg={m.kind==='否决项'?'rgba(248,113,113,0.1)':(m.kind==='约束'?'rgba(94,168,255,0.1)':'rgba(255,255,255,0.05)')}>{m.kind}</Tag>
            <div style={{flex:1, fontSize:10.5, color:T.ink, textDecoration:m.dead?'line-through':'none', lineHeight:1.5}}>
              {m.t}

          <div key={v} style={{fontSize:10.5, fontFamily:F.mono, color:T.green, padding:'2px 0'}}>✓ {v} · 回读一致</div>
        ))}
      </div>
  );
}
function PT({children, style}) {
  return <div style={{fontSize:10.5, fontWeight:700, color:T.ink, marginBottom:6, ...style}}>{children}</div>;

function KnowledgeLibrary({cards, setCards}) {
  const [filter, setFilter] = React.useState('all');          // all | global | fitness | widget
  const [query, setQuery] = React.useState('');
  const [detailId, setDetailId] = React.useState(null);        // 查看卡片
  const [addOpen, setAddOpen] = React.useState(false);         // 「记下来」新建
  const [draft, setDraft] = React.useState({name:'', desc:'', scope:'global'});
  const [mergeOld, setMergeOld] = React.useState(null);        // 相似卡片合并目标
  const [toast, setToast] = React.useState('');
  const timer = React.useRef(null);
  const say = t => { setToast(t); clearTimeout(timer.current);
    timer.current = setTimeout(()=>setToast(''), 2600); };

  const detail = cards.find(c=>c.id===detailId);
  const byScope = k => cards.filter(c=>c.scope===k);
  const totalHits = cards.reduce((a,c)=>a+c.hits, 0);
  const weekNew = cards.filter(c=>c.time>='09-06').length;
  const hit = c => !query.trim() || c.name.includes(query.trim()) || c.desc.includes(query.trim());
  const groups = filter==='all'
    ? [['全局', byScope('global')], ['我的健身App', byScope('fitness')], ['WidgetToDo', byScope('widget')]]
    : [[SCOPE_META[filter].label, cards.filter(c=>c.scope===filter)]];

  /* 相似度：2-gram 重合度（演示用，真实实现为 embedding 余弦） */
  const bigrams = s => { const t=String(s).replace(/[\s，。、·：:；;（）()「」《》/<>\-—]/g,'');
    const r=new Set(); for(let i=0;i<t.length-1;i++) r.add(t.slice(i,i+2)); return [...r]; };
  const simOf = (a,b) => { const A=bigrams(a.name+a.desc), B=bigrams(b.name+b.desc);
    const m=A.filter(g=>B.includes(g)).length;
    return Math.min(0.97, +(0.78+0.06*m).toFixed(2)); };

  const resetDraft = () => { setDraft({name:'', desc:'', scope:'global'}); setAddOpen(false); };
  const doAdd = () => {
    setCards(list=>[{id:'kp_'+(Date.now()%10000), name:draft.name.trim(), desc:draft.desc.trim(),
      scope:draft.scope, src:'手动 · 记下来', srcRef:'知识库 · 手动新建', linked:[], hits:0, time:'09-10'}, ...list]);
    resetDraft();
    say('已写入 cards/ 并同步索引 · 下次对话可被检索（E10）');
  };
  const doMerge = () => {
    const card = mergeOld.card;
    setCards(list=>list.map(c=>c.id===card.id
      ? {...c, desc:draft.desc.trim(), src:card.src+' · 手动记下来'} : c));
    setMergeOld(null); resetDraft();
    say('已合并到「'+card.name+'」· 未另建新卡（>0.92 合并 · E10）');
  };
  const submitAdd = () => {
    if (!draft.name.trim() || !draft.desc.trim()) return;
    let best=null, sim=0;
    cards.forEach(c=>{ if (c.dead) return; const s=simOf(draft, c); if (s>sim) { sim=s; best=c; } });
    if (best && sim>0.92) setMergeOld({card:best, sim});
    else doAdd();
  };
  const toggleDead = c => setCards(list=>list.map(x=>x.id===c.id?{...x, dead:!x.dead}:x));

  return (
    <div style={{flex:1, minWidth:0, background:T.bg, display:'flex', flexDirection:'column', position:'relative'}}>
      {/* 头部 */}
      <div style={{padding:'24px 34px 0', flexShrink:0}}>
        <div style={{display:'flex', alignItems:'flex-start', marginBottom:16}}>
          <div>
            <div style={{fontSize:20, fontWeight:700, color:T.ink, marginBottom:4}}>知识库</div>
            <div style={{fontSize:11.5, color:T.sub}}>
              schema 约束的知识卡片（是什么 · 被检索）· 与技能库（怎么做 · 被调用）同层分库
            </div>
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:9, alignItems:'center'}}>
            <div style={{display:'flex', alignItems:'center', gap:6, background:T.inputBg,
              border:'0.5px solid '+T.line, borderRadius:8, padding:'5px 11px', width:190}}>
              <span style={{fontSize:11, color:T.faint}}>🔍</span>
              <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="搜索概念名"
                style={{flex:1, background:'transparent', border:'none', outline:'none',
                  color:T.ink, fontSize:11.5, fontFamily:'inherit'}}/>
            </div>
            <div onClick={()=>setAddOpen(true)}
              style={{fontSize:11.5, fontWeight:600, color:'#fff', cursor:'pointer',
                background:'linear-gradient(135deg,'+T.purpleD+','+T.purple+')',
                borderRadius:8, padding:'6px 14px', boxShadow:'0 2px 12px rgba(139,92,246,0.35)'}}>
              ＋ 记下来
            </div>
          </div>
        </div>
        {/* 筛选 + 概览 */}
        <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6}}>
          {[['all','全部 '+cards.length],
            ['global','全局 '+byScope('global').length],
            ['fitness','我的健身App '+byScope('fitness').length],
            ['widget','WidgetToDo '+byScope('widget').length]].map(([k,label])=>(
            <div key={k} onClick={()=>setFilter(k)}
              style={{fontSize:11.5, padding:'4.5px 13px', borderRadius:20, cursor:'pointer',
                color:filter===k?T.ink:T.sub, border:'1px solid '+(filter===k?T.lineHi:T.line),
                background:filter===k?'rgba(255,255,255,0.06)':'transparent', fontWeight:filter===k?600:400}}>
              {label}
            </div>
          ))}
          <div style={{marginLeft:'auto', fontSize:10.5, color:T.faint, fontFamily:F.mono}}>
            检索命中累计 {totalHits} 次 · 本周新增 {weekNew} · 同概念 &gt;0.92 自动合并 · 冲突旧卡标失效
          </div>
        </div>
      </div>
      {/* 列表 */}
      <div style={{flex:1, overflowY:'auto', padding:'10px 34px 26px'}}>
        {groups.map(([label, list])=>(
          <div key={label} style={{marginBottom:6}}>
            <div style={{fontSize:10.5, fontWeight:600, color:T.faint, margin:'8px 0 8px'}}>{label}</div>
            {list.filter(hit).map(c=>(
              <KnowledgeCard key={c.id} c={c} onOpen={x=>setDetailId(x.id)}/>
            ))}
          </div>
        ))}
        {groups.every(([,l])=>l.filter(hit).length===0) && (
          <div style={{fontSize:11.5, color:T.faint, padding:'24px 0', textAlign:'center',
            border:'1px dashed '+T.line, borderRadius:10}}>没有匹配「{query.trim()}」的知识卡片</div>
        )}
      </div>
      {/* 卡片详情：四字段 schema · 来源跳转 · 关联卡片 */}
      {detail && (
        <SkillModal title={'知识卡片 · '+detail.id} onClose={()=>setDetailId(null)} width={480}>
          <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:12}}>
            <span style={{fontSize:14.5, fontWeight:700, color:detail.dead?T.faint:T.ink,
              textDecoration:detail.dead?'line-through':'none'}}>{detail.name}</span>
            <Tag c={SCOPE_META[detail.scope].c} bg={SCOPE_META[detail.scope].bg}>{SCOPE_META[detail.scope].label}</Tag>
            {detail.dead && <Tag c={T.faint}>已失效</Tag>}
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:10.5, color:T.faint, marginBottom:4}}>出处</div>

          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:10.5, color:T.faint, marginBottom:5}}>关联卡片</div>
            <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
              {detail.linked.length
                ? cards.filter(x=>detail.linked.includes(x.id)).map(x=>(
                  <span key={x.id} onClick={()=>setDetailId(x.id)}
                    style={{fontSize:10.5, color:T.blue, background:'rgba(94,168,255,0.1)', borderRadius:5,

          </div>
          <div style={{display:'flex', justifyContent:'flex-end', gap:9}}>

            <span style={{fontSize:10.5, color:T.faint, fontFamily:F.mono}}>&gt; 0.92 阈值</span>
          </div>
          <div style={{fontSize:11.5, color:T.sub, lineHeight:1.6, marginBottom:12}}>
            新概念与已有卡片高度相似，按知识层规则将<b style={{color:T.ink}}>合并而非另建</b>——没有去重的知识库三个月后就是垃圾场。
          </div>
          {[['原卡', mergeOld.card, T.blue], ['新卡', {name:draft.name.trim(), desc:draft.desc.trim(),
            src:'手动 · 记下来', scope:draft.scope}, T.green]].map(([label, c, color])=>(
            <div key={label} style={{border:'0.5px solid '+T.line, borderRadius:9, padding:'10px 12px',
              marginBottom:8, background:'rgba(255,255,255,0.02)'}}>
              <div style={{display:'flex', alignItems:'center', gap:7, marginBottom:3}}>
                <Tag c={color} bg={color+'1F'}>{label}</Tag>
                <span style={{fontSize:12, fontWeight:600, color:T.ink}}>{c.name}</span>
                <Tag c={SCOPE_META[c.scope].c} bg={SCOPE_META[c.scope].bg}>{SCOPE_META[c.scope].label}</Tag>
              </div>
              <div style={{fontSize:10.5, color:T.sub, lineHeight:1.5}}>{c.desc}</div>
              <div style={{fontSize:9.5, color:T.faint, fontFamily:F.mono, marginTop:4}}>出处 {c.src}</div>
            </div>
          ))}
          <div style={{fontSize:10.5, color:T.faint, marginBottom:14}}>
            合并规则：保留原卡概念名 · 复述取新卡 · 出处并存 · 关联卡片自动串接
          </div>
          <div style={{display:'flex', justifyContent:'flex-end', gap:9}}>
            <Btn onClick={()=>setMergeOld(null)}>取消</Btn>
            <Btn onClick={()=>{doAdd(); setMergeOld(null);}}>仍要另建</Btn>
            <Btn kind="primary" onClick={doMerge}>合并到原卡</Btn>
          </div>
        </SkillModal>
      )}
      {/* 操作反馈 */}
      {toast && (
        <div className="fadein" style={{position:'absolute', bottom:22, left:'50%', transform:'translateX(-50%)',
          background:'#222228', border:'0.5px solid '+T.lineHi, borderRadius:8, padding:'8px 16px',
          fontSize:11.5, color:T.ink, boxShadow:'0 8px 30px rgba(0,0,0,0.5)', whiteSpace:'nowrap', zIndex:80}}>
          {toast}
        </div>
      )}
    </div>
  );
}

/* ================= 应用外壳 ================= */
function App() {
  const [view, setView] = React.useState('home');            // home | chat | skills | knowledge
  const [skills, setSkills] = React.useState(SKILLS);         // 技能库（可增删/启停）
  const [cards, setCards] = React.useState(CARDS);             // 知识库（可增删/标失效/合并）
  const [curTask, setCurTask] = React.useState({key:'fitness', version:'v1.1', sid:'fit-run'});
  const [rightOpen, setRightOpen] = React.useState(true);
  const [rightTab, setRightTab] = React.useState('files');   // files | ctx
  const [artView, setArtView] = React.useState('tree');       // tree | stage | handoff（产物 Tab 二级视图）
  const [selectedFile, setSelectedFile] = React.useState('prd-v2.md');
  const [input, setInput] = React.useState('');
  // 只读 = 查看非当前版本的历史封版；「默认无版本号」（unversioned/）可正常对话
  const curProj = PROJECTS[curTask.key] || PROJECTS.fitness;
  const readOnly = view==='chat' && curTask.version!=='默认无版本号' && curTask.version!==curProj.versions[0];

  const start = () => {
    setView('chat'); setCurTask({key:'fitness', version:'v1.1', sid:'fit-run'});
    setRightOpen(true); setRightTab('files'); setArtView('tree'); setSelectedFile('prd-v2.md');
  };

  // 切项目时重置产物面板选中
  React.useEffect(()=>{
    setSelectedFile(curTask.key==='widget' ? 'clarification.md' : 'prd-v2.md');
  }, [curTask.key]);

  React.useEffect(()=>{
    const fit = ()=>{
      const s = Math.min(window.innerWidth/1480, window.innerHeight/920, 1);
      document.getElementById('stage').style.transform = 'scale('+s+')';
    };
    fit(); window.addEventListener('resize', fit);
    return ()=>window.removeEventListener('resize', fit);
  },[]);

  return (
    <div id="stage" style={{width:1480, height:920}}>
      <div style={{width:'100%', height:'100%', background:T.bg, borderRadius:11, overflow:'hidden',
        boxShadow:'0 60px 140px rgba(0,0,0,0.8), 0 0 0 0.5px rgba(255,255,255,0.1)',
        display:'flex', flexDirection:'column'}}>
        {/* 标题栏 */}
        <div style={{height:38, flexShrink:0, background:'#141416', borderBottom:'0.5px solid '+T.line,
          display:'flex', alignItems:'center', padding:'0 13px', position:'relative'}}>
          <div style={{display:'flex', gap:8}}>
            <span style={{width:12,height:12,borderRadius:'50%',background:'#ff5f57'}}/>
            <span style={{width:12,height:12,borderRadius:'50%',background:'#febc2e'}}/>
            <span style={{width:12,height:12,borderRadius:'50%',background:'#28c840'}}/>
          </div>
          <div style={{position:'absolute', left:0, right:0, textAlign:'center', fontSize:12.5,
            fontWeight:600, color:T.sub, pointerEvents:'none'}}>
            PM Copilot — {view==='chat' ? (PROJECTS[curTask.key]||PROJECTS.fitness).name
              : view==='skills' ? '技能库'
              : view==='knowledge' ? '知识库' : '新任务'}
          </div>
          <div style={{marginLeft:'auto', display:'flex', gap:10, alignItems:'center', fontSize:11, color:T.faint}}>
            <span>🔍</span><span>⛶</span>
          </div>
        </div>
        {/* 只读黄条 */}
        {readOnly && view==='chat' && (
          <div className="fadein" style={{background:'rgba(251,191,36,0.09)', borderBottom:'0.5px solid rgba(251,191,36,0.25)',
            padding:'5px 16px', fontSize:11.5, color:T.amber, display:'flex', alignItems:'center', gap:8}}>
            🔒 正在查看已封版 {curTask.version} · 全界面只读 · 与封版快照逐字一致（E13）
          </div>
        )}
        {/* 主体 */}
        <div style={{flex:1, minHeight:0, display:'flex'}}>
          <Sidebar view={view} curTask={curTask} setCurTask={setCurTask} setView={setView}
            skillCount={skills.length} cardCount={cards.length}/>
          {view==='home'
            ? <Home onStart={start} input={input} setInput={setInput}/>
            : view==='skills'
            ? <SkillLibrary skills={skills} setSkills={setSkills}/>
            : view==='knowledge'
            ? <KnowledgeLibrary cards={cards} setCards={setCards}/>
            : <ChatPanel curTask={curTask} setVersion={v=>setCurTask({...curTask, version:v})}
                readOnly={readOnly} goHome={()=>setView('home')}
                rightOpen={rightOpen} rightTab={rightTab}
                openPanel={(tab, active)=>{
                  if (active) { setRightOpen(false); }           // 再点同 Tab = 收起
                  else { setRightTab(tab); setRightOpen(true); } // 切 Tab / 打开
                }}
                onOpenFile={(f)=>{ setSelectedFile(f); setRightTab('files'); setArtView('tree'); setRightOpen(true); }}/>}
          {view==='chat' && rightOpen &&
            <RightPanel pKey={FILES[curTask.key]?curTask.key:'fitness'} tab={rightTab} setTab={setRightTab}
              onClose={()=>setRightOpen(false)} selectedFile={selectedFile} onSelectFile={setSelectedFile}
              artView={artView} setArtView={setArtView}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
