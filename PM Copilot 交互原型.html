<title>PM Copilot · 交互原型 v0.5</title>
<!--
  PM Copilot 交互原型（对应 design.md v0.5）
  假设与理由（Junior Designer 备注）：
  1. 视觉 = 模拟 macOS 原生 App（系统蓝、13px 系统字体、半透明侧栏）——文档定死「只用系统原生控件」，原型必须像原生
  2. 示例数据全部来自 design.md 的「我的健身App」案例（目标收敛句/约束/否决项/d_001 决策/Eval 场景），不编造无关内容
  3. 可点的关键路径（对应 Eval）：
     · 侧栏切项目「我的健身App ↔ WidgetToDo」→ 右栏检索 trace 的 scope 标签同步变（F16 / E12）
     · 工作区顶部五阶段切换器 → ①对话流 ②调研工具调用 ③PRD 预览 ④原型 WKWebView ⑤评审打分
     · 点「这条记下来」→ 相似卡片合并弹窗（E10）
     · 顶栏版本下拉切到 v1.0 🔒 → 全界面只读 + 黄条（E13/E14）
     · 右栏上下文检查器：token 构成条 + 检索 trace + 「已过滤 41 条」+ 未命中 skill（E11/E12 的可观测证明）
  4. 单文件 inline React（file:// 双击即开，无外部 jsx）
-->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    background:#1b1d22 radial-gradient(1200px 700px at 70% -10%, #2c3140 0%, #1b1d22 55%);
    display:flex; align-items:center; justify-content:center;
  }
  #stage { transform-origin:center center; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.2); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  .fadein { animation:fadein .18s ease both; }
  @keyframes fadein { from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.45;} }
  .rec-dot { animation:pulse 1.4s infinite; }
</style>
</head>

<div id="root"></div>
<script type="text/babel">

  {id:'kp_001', name:'目标用户偏好', text:'健身小白更在意「坚持反馈」而非「数据精度」。', src:'v1.1/03-discussions/01-clarify-notes.md#D1', merged:true, rel:['打卡动机模型']},
  {id:'kp_002', name:'竞品 Keep 定位', text:'大而全健身平台，社区留存提升 15%（出处）。', src:'v1.1/02-analysis/competitors-overview.md'},
  {id:'kp_003', name:'打卡动机模型', text:'外部动机（奖励/社交）启动快，内部动机（记录感）留存久。', src:'全局 · 手动记下来', rel:['目标用户偏好']},
];

const DECISIONS = [
  {id:'d_001', v:'v1.1', decision:'目标用户锁定健身小白', why:'专业人群已有 Keep 等成熟方案，差异化空间在小白的坚持反馈',
   rejected:[{option:'覆盖全人群', reason:'首版资源撑不起双场景'}], conf:0.8, verify:true, time:'09-09 14:30'},

   rejected:[{option:'做轻社区（好友排行）', reason:'仍需内容审核与关系链冷启动'}], conf:0.75, verify:false, time:'09-09 15:02'},

  {name:'generate_prototype', in:'project, version', out:'task_id → get_task', desc:'从 PRD 生成单文件 HTML 原型'},
  {name:'review_doc', in:'doc: string', out:'review: object', desc:'独立评审任意文档'},
  {name:'get_task', in:'task_id', out:'status / result', desc:'异步任务查询'},
];

const MCP_LOGS = [
  {t:'14:32:05', client:'Claude Desktop', tool:'generate_prd', arg:'我的健身App / v1.1', status:'done', ms:8412},
  {t:'14:20:41', client:'Cursor', tool:'analyze_requirement', arg:'"桌面小组件待办"', status:'done', ms:2210},
  {t:'13:58:17', client:'Claude Desktop', tool:'get_task', arg:'task_9f2k', status:'done', ms:38},
];

/* ========== 通用小组件 ========== */
const Dot = ({st}) => (
  <span style={{
    display:'inline-block', width:7, height:7, borderRadius:'50%', flexShrink:0,
    background: st==='done'?T.green : st==='run'?T.blue : '#C7C7CC',
    boxShadow: st==='run' ? `0 0 0 3px rgba(0,104,218,0.18)` : 'none',
  }}/>
);
const Tag = ({children, c=T.sub, bg='rgba(0,0,0,0.05)'}) => (
  <span style={{fontSize:10.5, padding:'1px 6px', borderRadius:4, color:c, background:bg, whiteSpace:'nowrap', fontFamily:F.sys}}>{children}</span>
);
const ScopeTag = ({s}) => {
  const map = {'我的健身App':T.blue, 'WidgetToDo':T.purple, '全局':T.gray, 'v1.1':T.green, 'v1.0':T.gray};
  const c = map[s] || T.gray;
  return <span style={{fontSize:10, padding:'1px 6px', borderRadius:4, color:'#fff', background:c, fontFamily:F.mono, whiteSpace:'nowrap'}}>{s}</span>;
};
const Btn = ({children, onClick, kind='ghost', disabled, style}) => {
  const base = {fontSize:12, padding:'4px 12px', borderRadius:6, cursor:disabled?'not-allowed':'pointer', fontFamily:F.sys,
    transition:'all .12s', border:`0.5px solid ${T.line}`, opacity:disabled?0.45:1, ...style};
  const kinds = {
    primary:{background:T.blue, color:'#fff', border:'none'},
    ghost:{background:'#fff', color:T.ink},
    danger:{background:'#fff', color:T.red, borderColor:'rgba(255,59,48,0.35)'},
  };
  return <button style={{...base, ...kinds[kind]}} onClick={disabled?undefined:onClick}>{children}</button>;
};
const SectionTitle = ({children, right}) => (
  <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8}}>
    <div style={{fontSize:12, fontWeight:600, color:T.ink}}>{children}</div>
    {right}
  </div>
);
const Card = ({children, style}) => (
  <div style={{background:T.cardBg, border:`0.5px solid ${T.line}`, borderRadius:10, padding:14, ...style}}>{children}</div>
);

/* ========== 侧栏 ========== */
function Sidebar({pKey, nav, setNav, setProject, project}) {
  const NAVS = [
    {id:'home', label:'项目主页'},
    {id:'workspace', label:'工作区', star:true},
    {id:'memory', label:'记忆抽屉'},
    {id:'skills', label:'技能库', star:true},
    {id:'cards', label:'卡片库'},
    {id:'versions', label:'版本回看'},
    {id:'decisions', label:'决策日志'},
    {id:'mcp', label:'MCP 状态'},
    {id:'settings', label:'设置'},
  ];
  return (
    <div style={{width:212, flexShrink:0, background:T.side, borderRight:`0.5px solid ${T.line}`, display:'flex', flexDirection:'column'}}>
      {/* 项目切换（切换即切 scope） */}
      <div style={{padding:'12px 12px 8px'}}>
        <div style={{fontSize:10.5, color:T.sub, marginBottom:6, letterSpacing:'.04em'}}>项目（切换即切 scope）</div>
        {Object.entries(PROJECTS).map(([k,p]) => (
          <div key={k} onClick={()=>setProject(k)}
            style={{display:'flex', alignItems:'center', gap:8, padding:'6px 9px', borderRadius:7, marginBottom:2, cursor:'pointer',

            <span style={{fontSize:14, width:16, textAlign:'center', opacity:.9}}>{k==='fitness'?'🏃':'🧩'}</span>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:12.5, fontWeight:500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{p.name}</div>
            </div>
            {k==='fitness' && <span style={{fontSize:9.5, fontFamily:F.mono, opacity:.75}}>v1.1</span>}
          </div>
        ))}
      </div>
      <div style={{height:.5, background:T.line, margin:'2px 12px 8px'}}/>
      {/* 导航 */}

        {NAVS.map(n => (
          <div key={n.id} onClick={()=>setNav(n.id)}

      </div>
    </div>
  );
}

/* ========== 工作区：五个阶段 ========== */
function ToolRow({icon, title, detail, ok=true}) {
  const [open,setOpen] = React.useState(false);
  return (
    <div style={{margin:'6px 0'}}>
      <div onClick={()=>setOpen(!open)} style={{display:'flex', alignItems:'center', gap:8, padding:'7px 10px', borderRadius:8,
        background:'rgba(0,0,0,0.03)', cursor:'pointer', border:`0.5px solid ${T.line}`, fontSize:11.5, fontFamily:F.mono}}>
        <span style={{fontSize:10, color:open?T.ink:T.sub, transition:'transform .15s', transform:open?'rotate(90deg)':'none'}}>▶</span>
        <span style={{width:14, textAlign:'center'}}>{icon}</span>
        <span style={{color:T.ink}}>{title}</span>
        <span style={{marginLeft:'auto', fontSize:10, color: ok?T.green:T.amber}}>{ok?'✓ verified':'…'}</span>
      </div>
      {open && <div className="fadein" style={{marginLeft:24, marginTop:4, padding:'8px 10px', borderLeft:`2px solid ${T.line}`, fontSize:11, color:T.sub, fontFamily:F.mono, lineHeight:1.7, whiteSpace:'pre-wrap'}}>{detail}</div>}
    </div>
  );
}

function StageView({stage, project, setModal}) {
  const p = PROJECTS[project];
  const s = STAGES[stage-1];

  /* ① 澄清：对话流 */
  if (stage===1) return (
    <div className="fadein" style={{display:'flex', flexDirection:'column', height:'100%'}}>
      <div style={{flex:1, overflowY:'auto', padding:'18px 26px'}}>
        <div style={{maxWidth:640, margin:'0 auto'}}>
          {/* 用户消息 */}
          <div style={{display:'flex', justifyContent:'flex-end', marginBottom:14}}>
            <div style={{background:T.blue, color:'#fff', padding:'9px 14px', borderRadius:16, borderBottomRightRadius:5, fontSize:13, maxWidth:'75%', lineHeight:1.55}}>
              想做个健身打卡的 App，帮我理理需求
            </div>
          </div>
          {/* skill 命中章 */}
          <div style={{display:'flex', gap:6, marginBottom:8, flexWrap:'wrap'}}>
            <Tag c={T.purple} bg='rgba(175,82,222,0.10)'>🎯 命中技能：{p.skillHit}</Tag>
            <Tag>已注入记忆 {p.memories.filter(m=>!m.dead).length} 条 · 按右栏 trace</Tag>
          </div>
          {/* AI 回复 */}
          <div style={{display:'flex', gap:10, marginBottom:14}}>
            <div style={{width:26, height:26, borderRadius:'50%', background:'linear-gradient(135deg,#5e8bff,#9b6bff)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontSize:11, fontWeight:600}}>C</div>
            <div style={{background:'#fff', border:`0.5px solid ${T.line}`, padding:'10px 14px', borderRadius:16, borderTopLeftRadius:5, fontSize:13, maxWidth:'82%', lineHeight:1.65, color:T.ink}}>
              先对齐一个关键问题：如果用户<b>连续 3 天没打卡</b>，你希望产品做什么？<br/>
              <span style={{color:T.sub, fontSize:12}}>——这个答案决定留存策略是「提醒拉回」还是「清零重来」，也会影响提醒权限的申请时机。</span>
            </div>
          </div>
          {/* 记忆写入（工具行） */}
          <ToolRow icon="🧠" title="memory.write · 约束「不做专业增肌人群」" detail={'{ "scope": "project", "type": "constraint",\n  "content": "不做专业增肌人群",\n  "verify": "回读一致 ✓ (write-then-verify)" }'}/>
          <ToolRow icon="🔍" title="retrieve · query「健身小白 · 留存策略」" detail={`命中 2 条（见右栏 trace）\nkp_001 目标用户偏好  sim=0.87  [scope: ${p.name}]\nkp_003 打卡动机模型  sim=0.81  [scope: 全局]\n${p.filtered}`}/>
          {/* 第二轮 */}
          <div style={{display:'flex', justifyContent:'flex-end', marginBottom:14}}>
            <div style={{background:T.blue, color:'#fff', padding:'9px 14px', borderRadius:16, borderBottomRightRadius:5, fontSize:13, maxWidth:'75%', lineHeight:1.55}}>
              温和提醒 + 补签机会，别让用户有挫败感
            </div>
          </div>
          <div style={{display:'flex', gap:10, marginBottom:14}}>
            <div style={{width:26, height:26, borderRadius:'50%', background:'linear-gradient(135deg,#5e8bff,#9b6bff)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontSize:11, fontWeight:600}}>C</div>
            <div style={{background:'#fff', border:`0.5px solid ${T.line}`, padding:'10px 14px', borderRadius:16, borderTopLeftRadius:5, fontSize:13, maxWidth:'82%', lineHeight:1.65, color:T.ink}}>
              记下了，本轮新决策：<b>中断恢复策略 = 温和提醒 + 每周 1 次补签</b>（已写入记忆层）。<br/>
              <span style={{color:T.sub, fontSize:12}}>下一个盲区：核心价值主张——用户打卡 30 天后，你给他看什么？</span>
            </div>
          </div>
          <div style={{textAlign:'center', fontSize:11, color:T.sub, margin:'6px 0'}}>— 澄清 3/5 轮 · 已知信息 6 · 盲区 2 · 本轮新决策 1 —</div>
        </div>
      </div>
      {/* 底部输入条 */}
      <div style={{padding:'10px 18px 14px', borderTop:`0.5px solid ${T.line}`, background:'rgba(255,255,255,0.6)'}}>
        <div style={{maxWidth:640, margin:'0 auto', display:'flex', gap:8}}>
          <div style={{flex:1, background:'#fff', border:`0.5px solid ${T.line}`, borderRadius:9, padding:'8px 12px', fontSize:12.5, color:T.sub}}>
            回复 Clarifier…（每轮只问一个最关键的问题）
          </div>
          <Btn onClick={()=>setModal('card-merge')}>✚ 这条记下来</Btn>
          <Btn kind="primary">发送</Btn>
        </div>
      </div>
    </div>
  );

  /* ② 调研：工具调用 + 分析包 */
  if (stage===2) return (

/* ========== 右栏：上下文检查器 ★★ ========== */
function Inspector({project, stage}) {
  const p = PROJECTS[project];
  const [showMissed, setShowMissed] = React.useState(false);
  const tokens = [
    {k:'系统规则', v:1.2, c:T.gray}, {k:'记忆', v:0.8, c:T.blue},
    {k:'Skill 正文', v:1.5, c:T.purple}, {k:'检索', v:2.1, c:T.green},
    {k:'对话历史', v:4.4, c:T.amber},
  ];
  const total = tokens.reduce((a,b)=>a+b.v,0);
  return (
    <div style={{width:296, flexShrink:0, borderLeft:`0.5px solid ${T.line}`, background:'rgba(252,252,253,0.9)', overflowY:'auto', padding:'14px 14px 20px'}}>
      <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:2}}>
        <span style={{fontSize:12.5, fontWeight:700}}>上下文检查器</span>
        <span style={{fontSize:9, color:T.amber}}>★★</span>
        <span className="rec-dot" style={{marginLeft:'auto', fontSize:9.5, color:T.red, fontFamily:F.mono}}>● LIVE</span>
      </div>
      <div style={{fontSize:10.5, color:T.sub, marginBottom:14}}>本次请求 · {STAGES[stage-1].label} · 第 3 轮 · 项目 [{p.name}]</div>

      {/* token 构成条 */}
      <SectionTitle right={<span style={{fontSize:10, color:T.sub, fontFamily:F.mono}}>{total.toFixed(1)}k / 32k</span>}>Token 构成</SectionTitle>
      <div style={{display:'flex', height:14, borderRadius:4, overflow:'hidden', marginBottom:8}}>
        {tokens.map(t=><div key={t.k} style={{width:`${t.v/total*100}%`, background:t.c}}/>)}
      </div>
      <div style={{display:'flex', flexWrap:'wrap', gap:5, marginBottom:18}}>
        {tokens.map(t=>(
          <span key={t.k} style={{display:'flex', alignItems:'center', gap:4, fontSize:10.5, color:T.sub}}>
            <span style={{width:7,height:7,borderRadius:2,background:t.c}}/>{t.k} {t.v}k
          </span>
        ))}
      </div>

      {/* 检索 trace */}
      <SectionTitle right={<Tag c={T.blue} bg='rgba(0,104,218,0.08)'>scope 强制过滤</Tag>}>检索 Trace</SectionTitle>
      <div style={{fontSize:10.5, fontFamily:F.mono, color:T.sub, marginBottom:6, background:'rgba(0,0,0,0.03)', padding:'5px 8px', borderRadius:6}}>
        query: {p.traceQuery}
      </div>
      {p.traceHits.map(h=>(
        <div key={h.id} style={{display:'flex', alignItems:'center', gap:6, padding:'5px 8px', border:`0.5px solid ${T.line}`, borderRadius:7, marginBottom:5, background:'#fff'}}>
          <span style={{fontSize:10.5, fontFamily:F.mono, color:T.blue}}>{h.id}</span>
          <span style={{fontSize:11, flex:1, minWidth:0, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{h.name}</span>
          <span style={{fontSize:9.5, fontFamily:F.mono, color:T.gray}}>{h.sim}</span>
          <ScopeTag s={h.scope}/>
        </div>
      ))}
      <div style={{fontSize:10.5, color:T.amber, background:'rgba(232,160,0,0.08)', padding:'5px 8px', borderRadius:6, marginBottom:18, fontFamily:F.mono}}>
        ⛔ {p.filtered}
      </div>

      {/* skill 命中 / 未命中 */}
      <SectionTitle right={<Tag c={T.purple} bg='rgba(175,82,222,0.08)'>E11</Tag>}>Skill 注入（1 / 30）</SectionTitle>
      <div style={{padding:'6px 8px', border:`0.5px solid rgba(175,82,222,0.3)`, borderRadius:7, background:'rgba(175,82,222,0.05)', marginBottom:6}}>
        <div style={{fontSize:11.5, fontWeight:600, color:T.purple}}>✓ {p.skillHit}</div>
        <div style={{fontSize:10, color:T.sub, fontFamily:F.mono}}>正文 1.5k tokens · 仅此 1 条正文入上下文</div>
      </div>
      <div onClick={()=>setShowMissed(!showMissed)} style={{fontSize:10.5, color:T.sub, cursor:'pointer', padding:'4px 8px'}}>
        ▸ {showMissed?'收起':'展开'}未命中 29 条（证明未被注入）
      </div>
      {showMissed && (
        <div className="fadein" style={{marginTop:4}}>
          {SKILLS.filter(s=>s.name!==p.skillHit).slice(0,4).map(s=>(
            <div key={s.name} style={{fontSize:10.5, color:T.sub, padding:'4px 8px', opacity:0.6}}>
              ✕ {s.name} · <span style={{fontFamily:F.mono}}>when_to_use 仅元数据常驻（~30 tok）</span>
            </div>
          ))}
          <div style={{fontSize:10.5, color:T.sub, padding:'4px 8px', opacity:0.6}}>… 其余 25 条同上，正文 0 token 注入</div>
        </div>
      )}

      {/* write-then-verify 日志 */}
      <div style={{marginTop:18}}>
        <SectionTitle>落盘校验（write-then-verify）</SectionTitle>
        <div style={{fontSize:10.5, fontFamily:F.mono, color:T.sub, lineHeight:1.9}}>
          <div>✓ decisions.jsonl#d_002 · 回读一致</div>
          <div>✓ knowledge/kp_001 · 回读一致</div>
        </div>
      </div>
    </div>
  );
}

/* ========== 弹窗：相似卡片合并（E10） ========== */

  const p = PROJECTS[project];
  return (
    <div onClick={onClose} style={{position:'absolute', inset:0, background:'rgba(0,0,0,0.25)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:50, backdropFilter:'blur(2px)'}}>
      <div onClick={e=>e.stopPropagation()} className="fadein" style={{width:440, background:'#fff', borderRadius:14, boxShadow:'0 24px 70px rgba(0,0,0,0.3)', overflow:'hidden'}}>
        <div style={{padding:'16px 18px 12px'}}>
          <div style={{fontSize:14, fontWeight:700, marginBottom:2}}>「这条记下来」→ 相似卡片检测</div>

        <div style={{padding:'0 18px'}}>

              <span style={{fontSize:12.5, fontWeight:600}}>目标用户偏好</span>
            </div>
            <div style={{fontSize:11.5, color:T.sub, lineHeight:1.6}}>健身小白更在意「坚持反馈」而非「数据精度」。</div>
          </div>
          <div style={{textAlign:'center', fontSize:11, color:T.sub, margin:'2px 0'}}>↓ 相似度 0.94 · 建议合并 ↓</div>
          <div style={{border:`1.5px solid ${T.blue}`, borderRadius:9, padding:10, marginBottom:8, background:'rgba(0,104,218,0.03)'}}>
            <div style={{display:'flex', gap:6, alignItems:'center', marginBottom:4}}>
              <Tag c={T.blue} bg='rgba(0,104,218,0.10)'>新卡（草拟）</Tag>
              <span style={{fontSize:12.5, fontWeight:600}}>目标用户偏好</span>
            </div>

          <Btn onClick={onClose}>取消</Btn>
          <Btn onClick={onClose}>另建独立卡</Btn>
          <Btn kind="primary" onClick={onClose}>合并进 kp_001</Btn>
        </div>

  );
}

/* ========== 应用外壳 ========== */
function App() {
  const [project, setProject] = React.useState('fitness');
  const [nav, setNav] = React.useState('workspace');
  const [stage, setStage] = React.useState(1);
  const [version, setVersion] = React.useState('v1.1');
  const [modal, setModal] = React.useState(null);
  const [guide, setGuide] = React.useState(false);
  const readOnly = version==='v1.0';
  const p = PROJECTS[project];

  // 缩放适配视口
  React.useEffect(()=>{
    const fit = ()=>{
      const s = Math.min(window.innerWidth/1440, window.innerHeight/880, 1);
      document.getElementById('stage').style.transform = `scale(${s})`;
    };
    fit(); window.addEventListener('resize', fit);
    return ()=>window.removeEventListener('resize', fit);
  },[]);

  return (
    <div id="stage" style={{width:1440, height:880}}>
      {/* macOS 窗口 */}
      <div style={{width:'100%', height:'100%', background:'#fff', borderRadius:11, overflow:'hidden',
        boxShadow:'0 40px 100px rgba(0,0,0,0.45), 0 0 0 0.5px rgba(0,0,0,0.3)', display:'flex', flexDirection:'column', position:'relative'}}>
        {/* 标题栏 */}
        <div style={{height:40, flexShrink:0, background:'linear-gradient(to bottom,#f6f6f6,#ececec)', borderBottom:`0.5px solid ${T.line}`, display:'flex', alignItems:'center', padding:'0 14px', position:'relative'}}>
          <div style={{display:'flex', gap:8}}>
            <span style={{width:12,height:12,borderRadius:'50%',background:'#ff5f57',border:'0.5px solid rgba(0,0,0,0.15)'}}/>
            <span style={{width:12,height:12,borderRadius:'50%',background:'#febc2e',border:'0.5px solid rgba(0,0,0,0.15)'}}/>
            <span style={{width:12,height:12,borderRadius:'50%',background:'#28c840',border:'0.5px solid rgba(0,0,0,0.15)'}}/>
          </div>
          <div style={{position:'absolute', left:0, right:0, textAlign:'center', fontSize:13, fontWeight:500, color:'#444', pointerEvents:'none'}}>
            PM Copilot — {p.name}
          </div>
          {/* 版本下拉（E13/E14 演示入口） */}
          <div style={{marginLeft:'auto', display:'flex', gap:8, alignItems:'center', position:'relative', zIndex:10}}>
            <select value={version} onChange={e=>setVersion(e.target.value)}
              style={{fontSize:11.5, padding:'3px 8px', borderRadius:6, border:`0.5px solid ${T.line}`, background:'#fff', fontFamily:F.mono, color:readOnly?T.amber:T.ink, cursor:'pointer'}}>
              {p.versions.map(v=><option key={v} value={v}>{v}{v==='v1.0'?' 🔒':''}</option>)}
            </select>
            <Btn onClick={()=>setGuide(!guide)}>？演示要点</Btn>
          </div>
        </div>

        {/* 只读黄条 */}
        {readOnly && (
          <div className="fadein" style={{background:'rgba(232,160,0,0.12)', borderBottom:`0.5px solid rgba(232,160,0,0.3)`, padding:'6px 16px', fontSize:12, color:'#8a6200', display:'flex', alignItems:'center', gap:8}}>
            🔒 正在查看已封版 v1.0 · 全界面只读 · 与封版快照逐字一致（E13）· 切回 v1.1 可继续编辑
          </div>
        )}

        {/* 三栏主体 */}
        <div style={{flex:1, minHeight:0, display:'flex'}}>
          <Sidebar pKey={project} nav={nav} setNav={setNav} setProject={(k)=>{setProject(k); setVersion(PROJECTS[k].versions[0]);}} project={project}/>
          <div style={{flex:1, minWidth:0, position:'relative', background:'#fbfbfd'}}>
            <MainView nav={nav} stage={stage} setStage={setStage} project={project} setModal={setModal} readOnly={readOnly}/>
          </div>
          <Inspector project={project} stage={stage}/>
        </div>

        {modal==='card-merge' && <MergeModal onClose={()=>setModal(null)} project={project}/>}

        {/* 演示要点浮层 */}
        {guide && (
          <div className="fadein" style={{position:'absolute', top:52, right:16, width:300, background:'rgba(28,28,32,0.94)', borderRadius:12, padding:'16px 18px', color:'#eee', zIndex:60, boxShadow:'0 16px 50px rgba(0,0,0,0.4)', fontSize:11.5, lineHeight:1.9, backdropFilter:'blur(8px)'}}>
            <div style={{fontWeight:700, marginBottom:4, fontSize:12.5}}>可点的关键路径（对应 Eval）</div>
            <div>· 侧栏切 <b>项目</b> → 右栏 trace 的 scope 标签同步变（E12）</div>

            <div>· ① 环点<b>「这条记下来」</b> → 相似卡片合并弹窗（E10）</div>
            <div>· 顶栏版本切 <b>v1.0 🔒</b> → 只读 + 黄条（E13/E14）</div>
            <div>· ② 环点<b>工具调用条</b>展开 → 出处 URL（E4/E5）</div>
            <div>· 右栏<b>展开未命中 29 条</b> → 证明正文未注入（E11）</div>
            <div style={{marginTop:6, paddingTop:6, borderTop:'0.5px solid rgba(255,255,255,0.15)', color:'#aaa'}}>S12 检查器 = 「某东西没发生」的可观测证明</div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
